<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小院时光 · A Little Courtyard</title>
<meta name="description" content="纯前端 Three.js 微缩小院：昼夜天气、雨雪萤火虫，点房子进屋逛三室，小女孩在院子里散步荡秋千。">
<meta property="og:title" content="小院时光 · A Little Courtyard">
<meta property="og:description" content="一个可逛的 3D 微缩小院：真实时区天气、昼夜切换，点房子进屋，和小女孩一起看鱼荡秋千。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffe3c2'/%3E%3Cpath d='M6 20 L16 10 L26 20 Z' fill='%23c96f4a'/%3E%3Crect x='11' y='18' width='10' height='8' fill='%23e8b07a'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23ffb36b'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffe9d2;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #title {
    position: fixed; top: 26px; left: 30px; color: #7a5a3a; z-index: 10;
    text-shadow: 0 2px 10px rgba(255, 250, 240, .8); user-select: none; pointer-events: none;
  }
  #title h1 { font-size: 26px; font-weight: 700; letter-spacing: 6px; }
  /* 夜里背景是深靛蓝，标题和提示条换成浅色字，不然看不见 */
  body.night #title { color: #eef0ff; text-shadow: 0 2px 12px rgba(8, 16, 52, .85); }
  body.night #hint { color: #e4e9ff; background: rgba(22, 36, 88, .45); }
  #title p  { font-size: 12px; letter-spacing: 3px; opacity: .7; margin-top: 6px; }

  #hint {
    position: fixed; top: 32px; right: 30px; z-index: 10; color: #7a5a3a;
    font-size: 12px; letter-spacing: 1px;
    background: rgba(255,255,255,.5); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; user-select: none; pointer-events: none;
  }

  #ihint {
    position: fixed; top: 32px; left: 50%; transform: translateX(-50%); z-index: 10; color: #7a5a3a;
    font-size: 12px; letter-spacing: 1px; white-space: nowrap;
    background: rgba(255,255,255,.55); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; user-select: none; pointer-events: none;
  }

  #panel {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    max-width: min(96vw, 980px); pointer-events: none;
    background: rgba(255,255,255,.45); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.7); border-radius: 999px; padding: 8px;
    box-shadow: 0 8px 30px rgba(160, 110, 60, .18);
  }
  #panel button, #panel select { pointer-events: auto; }
  #panel button {
    border: none; cursor: pointer; border-radius: 999px; padding: 9px 20px;
    font-size: 13px; letter-spacing: 2px; color: #7a5a3a;
    background: rgba(255,255,255,.85); transition: all .25s ease;
    font-family: inherit;
  }
  #panel button:hover { background: #fff; transform: translateY(-1px); }
  #panel button.active { background: #c96f4a; color: #fff; box-shadow: 0 4px 14px rgba(200, 110, 70, .45); }
  #panel select {
    border: none; cursor: pointer; border-radius: 999px; padding: 9px 16px 9px 18px;
    font-size: 13px; letter-spacing: 2px; color: #7a5a3a;
    background: rgba(255,255,255,.85); font-family: inherit;
    outline: none; appearance: none; -webkit-appearance: none;
  }
  #panel select:hover { background: #fff; }
  #clock {
    position: fixed; top: 72px; left: 30px; z-index: 10; color: #7a5a3a;
    font-size: 13px; letter-spacing: 2px;
    background: rgba(255,255,255,.5); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; user-select: none; pointer-events: none;
  }
  #clock .temp { opacity: .7; font-size: 12px; margin-left: 8px; letter-spacing: 1px; }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(#ffe3c2, #fff3e4); color: #7a5a3a;
    transition: opacity .8s ease; letter-spacing: 4px; font-size: 14px;
  }
  #loading .sun {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffedbd, #ffb36b);
    box-shadow: 0 0 40px #ffc98a; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  #loading.hide { opacity: 0; pointer-events: none; }

  #ihint.hide {
    opacity: 0; transition: opacity .45s ease;
  }

  #toast {
    position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%) translateY(8px);
    z-index: 14; max-width: min(88vw, 360px); pointer-events: none;
    color: #7a5a3a; font-size: 13px; letter-spacing: 1px; text-align: center;
    background: rgba(255,255,255,.72); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.75); border-radius: 999px;
    padding: 10px 18px; box-shadow: 0 8px 24px rgba(160,110,60,.16);
    opacity: 0; transition: opacity .28s ease, transform .28s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #statusCard {
    position: fixed; top: 118px; left: 30px; z-index: 11;
    max-width: min(46vw, 280px); color: #7a5a3a;
    background: rgba(255,255,255,.55); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.7); border-radius: 16px;
    padding: 10px 34px 10px 14px; box-shadow: 0 6px 20px rgba(160,110,60,.14);
    font-size: 12px; letter-spacing: 1px; line-height: 1.55;
    transition: opacity .4s ease, transform .4s ease;
  }
  #statusCard.hide { opacity: 0; pointer-events: none; transform: translateY(-6px); }
  #statusCard .sc-label { opacity: .55; font-size: 11px; margin-bottom: 2px; }
  #statusCard .sc-text { user-select: none; }
  #statusCard .sc-x {
    position: absolute; top: 6px; right: 8px; border: none; cursor: pointer;
    background: transparent; color: #7a5a3a; opacity: .55; font-size: 14px;
    line-height: 1; padding: 4px 6px; font-family: inherit;
  }
  #statusCard .sc-x:hover { opacity: 1; }

  #vpad {
    position: fixed; left: 18px; bottom: 96px; width: 118px; height: 118px;
    z-index: 12; display: none; pointer-events: none; touch-action: none;
  }
  #vpad.on { display: block; }
  #vpad .base {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(255,255,255,.32); border: 2px solid rgba(122,90,58,.32);
    box-shadow: 0 6px 18px rgba(160,110,60,.16);
  }
  #vpad .knob {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(201,111,74,.78); border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 2px 10px rgba(160,80,40,.28);
    transition: none;
  }
  #lookZone {
    position: fixed; right: 18px; bottom: 110px; z-index: 12;
    display: none; pointer-events: none; user-select: none;
    color: #7a5a3a; font-size: 11px; letter-spacing: 1px;
    background: rgba(255,255,255,.4); backdrop-filter: blur(8px);
    padding: 6px 12px; border-radius: 999px; opacity: .85;
  }
  #lookZone.on { display: block; }

  @media (max-width: 640px) {
    #title h1 { font-size: 20px; letter-spacing: 3px; }
    #hint { display: none; }
    #panel button { padding: 8px 14px; font-size: 12px; }
    #clock { top: 58px; left: 16px; font-size: 12px; }
    #panel select { padding: 8px 12px; font-size: 12px; }
    #ihint { top: 24px; max-width: 92vw; white-space: normal; text-align: center; line-height: 1.45; }
    #vpad { left: 12px; bottom: 88px; width: 108px; height: 108px; }
    #vpad .knob { width: 42px; height: 42px; }
    #toast { bottom: 96px; font-size: 12px; }
    #statusCard { top: 98px; left: 16px; max-width: min(78vw, 260px); }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1>小院时光</h1>
  <p>A LITTLE COURTYARD · 3D DIORAMA</p>
</div>
<div id="hint">🖱 拖拽旋转 · 滚轮缩放 · 右键平移 · 点一点小女孩 / 小猫 / 小兔 / 向日葵 / 灯笼 / 锦鲤 · 点房子进屋</div>
<div id="ihint" style="display:none">🏠 WASD / 方向键 走动 · 按住拖拽 环视 · 点门离开 · ESC 或点「回到院子」</div>
<div id="clock"><span id="clockTime">北京 --:--</span><span class="temp" id="clockWx"></span><span class="temp" id="clockTemp"></span></div>
<div id="statusCard" class="hide" aria-live="polite">
  <button type="button" class="sc-x" id="statusDismiss" aria-label="关闭">×</button>
  <div class="sc-label">小院絮语</div>
  <div class="sc-text" id="statusText"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="panel">
  <select id="citySelect" aria-label="城市"></select>
  <button id="btnQuality" aria-label="画质">画质 高</button>
  <button id="btnAudio" aria-label="环境音">环境音 关</button>
  <button id="btnDay">🌙 夜晚</button>
  <button id="btnRotate">🔄 自动旋转</button>
  <button id="btnPhoto" aria-label="今日拍照">📷 今日拍照</button>
  <button id="btnExit" style="display:none">🚪 回到院子</button>
</div>
<div id="loading"><div class="sun"></div><div>正在准备小院子…</div></div>
<div id="vpad" aria-hidden="true"><div class="base"></div><div class="knob" id="vpadKnob"></div></div>
<div id="lookZone">右半屏 · 环视</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
  }
}
</script>

<script type="module">
// Three.js 经上方 import map 从 jsDelivr CDN 加载（需联网；未内联 vendor 以保持单文件轻量）
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   基础：渲染器 / 场景 / 相机 / 控制器（微缩景观视角）
============================================================ */
const app = document.getElementById('app');
// 场景先画进 HDR 离屏缓冲（自带 MSAA），再由后期统一描线 / 反射 / 泛光 / 调色，
// 所以默认帧缓冲不需要再开抗锯齿。
// powerPreference: high-performance → 双显卡笔记本上让浏览器选独立显卡
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
// 查一下浏览器实际用的是哪块 GPU：SwiftShader / llvmpipe / Basic Render 都是 CPU 软件模拟，
// 说明硬件加速被关了或显卡被拉黑，画面会很卡 → 自动降到低画质并提示怎么打开
const GPU_INFO = (() => {
  let name = '';
  try {
    const gl = renderer.getContext();
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    name = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
  } catch (_) {}
  const software = /swiftshader|llvmpipe|softpipe|software|basic render|microsoft basic/i.test(name);
  return { name, software };
})();
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
// 赛璐璐风：投影边缘要干脆，不要 PCFSoft 那种大片柔边
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf0e0cc, 0.0);

// 环境贴图：给水、石等 PBR 材质带来柔和的反射层次
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
camera.position.set(19, 17, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.addEventListener('start', () => {
  if (controls.autoRotate) { controls.autoRotate = false; btnRotate.classList.remove('active'); }
});

/* ============================================================
   画质档（高/低）· localStorage: yard-quality
============================================================ */
const QUALITY_KEY = 'yard-quality';
const fluffTargets = [];
function detectDefaultQuality() {
  try {
    const saved = localStorage.getItem(QUALITY_KEY);
    if (saved === 'low' || saved === 'high') return saved;
  } catch (_) {}
  if (GPU_INFO.software) return 'low';
  let coarse = false, lowMem = false;
  try { coarse = matchMedia('(pointer: coarse)').matches; } catch (_) {}
  try { if (navigator.deviceMemory != null && navigator.deviceMemory <= 4) lowMem = true; } catch (_) {}
  if (devicePixelRatio <= 1 || coarse || lowMem) return 'low';
  return 'high';
}
let quality = detectDefaultQuality();
let post = null;   // 动画风后期管线（在场景搭好后创建，见「动画风后期管线」）

function gateFluffShells(target) {
  const shells = target.userData.fluffShells;
  if (!shells || !shells.length) return;
  const keep = quality === 'low' ? Math.max(1, Math.ceil(shells.length * 0.5)) : shells.length;
  for (let i = 0; i < shells.length; i++) shells[i].visible = i < keep;
}

function applyShadowQuality() {
  const size = quality === 'low' ? 1024 : 4096;
  if (sun.shadow.mapSize.x === size && sun.shadow.mapSize.y === size) return;
  sun.shadow.mapSize.set(size, size);
  if (sun.shadow.map) {
    sun.shadow.map.dispose();
    sun.shadow.map = null;
  }
}

let particlesReady = false;
function applyParticleQuality() {
  if (!particlesReady) return;
  rainLive = quality === 'low' ? (RAIN_N >> 1) : RAIN_N;
  snowLive = quality === 'low' ? (SNOW_N >> 1) : SNOW_N;
  rainGeo.setDrawRange(0, rainLive * 2);
  snowPoints.geometry.setDrawRange(0, snowLive);
}

function syncQualityButton() {
  const btn = document.getElementById('btnQuality');
  if (!btn) return;
  btn.textContent = quality === 'high' ? '画质 高' : '画质 低';
  btn.classList.toggle('active', quality === 'high');
}

function applyQuality(q, persist = true) {
  quality = (q === 'low') ? 'low' : 'high';
  if (persist) {
    try { localStorage.setItem(QUALITY_KEY, quality); } catch (_) {}
  }
  applyShadowQuality();
  applyParticleQuality();
  for (const t of fluffTargets) gateFluffShells(t);
  if (post) post.resize();
  syncQualityButton();
}

/* ============================================================
   光照（日系动画：暖白主光 + 偏蓝的天光，暗部发冷）
   实际数值每帧按 DAY / NIGHT 两套调色插值，这里只是初值
============================================================ */
const hemi = new THREE.HemisphereLight(0xdfeaff, 0x9cbf86, 1.0);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xd6e2ff, 0.3);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff1d8, 2.1);
sun.position.set(26, 34, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(quality === 'low' ? 1024 : 4096, quality === 'low' ? 1024 : 4096);
sun.shadow.camera.left = -21; sun.shadow.camera.right = 21;
sun.shadow.camera.top = 21;   sun.shadow.camera.bottom = -21;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// 反方向的冷色补光，增强体积感
const fillLight = new THREE.DirectionalLight(0x9db8ff, 0.35);
fillLight.position.set(-24, 14, -20);
scene.add(fillLight);

/* ============================================================
   背景（动画风天空渐变球，衬托悬浮小岛）、太阳 / 月亮、星星
============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    topColor:    { value: new THREE.Color(0x5b9ee8) },
    bottomColor: { value: new THREE.Color(0xd8ebff) },
  },
  vertexShader: `
    varying vec3 vPos;
    void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec3 vPos;
    uniform vec3 topColor; uniform vec3 bottomColor;
    void main() {
      float h = normalize(vPos).y;
      // 俯视微缩景观时，画面里的天空大多在地平线以下，所以渐变区间要整体下移，
      // 否则背景被钳成一整片纯色
      gl_FragColor = vec4(mix(bottomColor, topColor, smoothstep(-0.55, 0.6, h)), 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), skyMat));

const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(6, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xffdda0, transparent: true, fog: false })
);
sunDisc.position.set(85, 55, -75);
scene.add(sunDisc);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(5, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xf4f7ff, transparent: true, opacity: 0, fog: false })
);
moon.position.set(-65, 52, 45);
scene.add(moon);

// 星星
const starGeo = new THREE.BufferGeometry();
{
  const pos = [];
  for (let i = 0; i < 320; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.42;
    const r = 170;
    pos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi) + 5, r * Math.sin(phi) * Math.sin(theta));
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, transparent: true, opacity: 0, fog: false, sizeAttenuation: true });
scene.add(new THREE.Points(starGeo, starMat));

/* ============================================================
   材质工具
============================================================ */
// 赛璐璐两阶色：受光面一整块亮色，背光面一整块暗色，明暗交界线干脆利落
// （three 的 toon 采样坐标是 dot(N,L)*0.5+0.5，前一半纹素 = 背光）
function makeGradient() {
  const c = new Uint8Array([72, 72, 72, 72, 255, 255, 255, 255]);
  const t = new THREE.DataTexture(c, c.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const GRAD = makeGradient();
const mat = (color, opts = {}) => new THREE.MeshToonMaterial({ color, gradientMap: GRAD, ...opts });
// 夜晚光晕精灵的登记表
const bulbGlows = [], lanternGlows = [], windowGlows = [];
// 柔光圆点贴图（炊烟 / 光晕 / 流星共用）
const smokeTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,.85)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

/* ---------- 毛茸茸外壳（多层 alphaTest 斑点壳）---------- */
function makeFurTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x2 = c.getContext('2d');
  x2.fillStyle = '#000'; x2.fillRect(0, 0, 128, 128);
  x2.strokeStyle = '#fff';
  for (let i = 0; i < 1500; i++) {
    const px = Math.random() * 128, py = Math.random() * 128;
    const ang = Math.random() * Math.PI * 2, ln = 2.5 + Math.random() * 5;
    x2.lineWidth = Math.random() < 0.55 ? 1 : 1.8;
    x2.beginPath();
    x2.moveTo(px, py);
    x2.lineTo(px + Math.cos(ang) * ln, py + Math.sin(ang) * ln);
    x2.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const FUR_TEX = makeFurTex();

function fluffify(target, opts = {}) {
  const { layers = 6, growth = 0.075, tint = 0 } = opts;
  const baseCol = target.material.color;
  const shells = [];
  for (let k = 1; k <= layers; k++) {
    const sm = new THREE.MeshToonMaterial({
      color: baseCol.clone().lerp(new THREE.Color(0xffffff), tint * (k / layers)),
      gradientMap: GRAD,
      alphaMap: FUR_TEX,
      alphaTest: 0.42
    });
    const sh = new THREE.Mesh(target.geometry, sm);
    sh.scale.setScalar(1 + growth * k);
    sh.castShadow = false;
    target.add(sh);
    shells.push(sh);
  }
  target.userData.fluffShells = shells;
  fluffTargets.push(target);
  gateFluffShells(target);
}

/* ---------- 静态细节合批 ----------
   细节一多，每个零件一个 Mesh 会让 draw call（外加阴影那一遍）翻倍。
   Kit 把同一材质的零件烘焙好变换后合成一个网格：细节照加，draw call 只按材质数算。
   只用于不会单独动的零件；会动的部分各自建一个 Kit 挂在自己的骨骼 / 组上。 */
class Kit {
  constructor() { this.parts = new Map(); }
  add(geo, material, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
    _kitM.compose(_kitP.set(x, y, z), _kitQ.setFromEuler(_kitE.set(rx, ry, rz)), _kitS.set(sx, sy, sz));
    return this.addMatrix(geo, material, _kitM);
  }
  addMatrix(geo, material, matrix) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(matrix);
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') g.deleteAttribute(k);
    if (!g.attributes.normal) g.computeVertexNormals();
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    if (!this.parts.has(material)) this.parts.set(material, []);
    this.parts.get(material).push(g);
    return this;
  }
  build(parent, { cast = true, receive = true } = {}) {
    const out = [];
    for (const [m, list] of this.parts) {
      const me = new THREE.Mesh(mergeGeometries(list, false), m);
      for (const g of list) g.dispose();
      me.castShadow = cast; me.receiveShadow = receive;
      parent.add(me);
      out.push(me);
    }
    this.parts.clear();
    return out;
  }
}
const _kitM = new THREE.Matrix4(), _kitP = new THREE.Vector3(), _kitQ = new THREE.Quaternion();
const _kitE = new THREE.Euler(), _kitS = new THREE.Vector3();

function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d);
  s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function extrudeRounded(w, d, r, depth) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, d, r), {
    depth, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.16, bevelSegments: 3, curveSegments: 10
  });
  geo.rotateX(-Math.PI / 2);   // 平放，形状平面 → xz
  return geo;                  // y ∈ [-depth - bevel, +bevel]
}

const bulbs = [];
const BULB_COLS = [0xff6b8a, 0x5ec8f8, 0xffd75e, 0x7ee787, 0xc792ff, 0xffa45e];
function stringLights(a, b, dip) {
  const pts = [];
  for (let i = 0; i <= 20; i++) {
    const t = i / 20;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    p.y -= Math.sin(t * Math.PI) * dip;
    pts.push(p);
  }
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x5c4a3a })
  ));
  for (let i = 2; i < 20; i += 3) {
    const col = BULB_COLS[bulbs.length % BULB_COLS.length];
    const bm = new THREE.MeshToonMaterial({ color: col, gradientMap: GRAD, emissive: col, emissiveIntensity: 0 });
    const bulb = mesh(sph(0.065, 10), bm, pts[i].x, pts[i].y - 0.05, pts[i].z);
    scene.add(bulb);
    const bg = new THREE.Sprite(new THREE.SpriteMaterial({
      map: smokeTex, color: col, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    bg.scale.setScalar(0.6);
    bg.position.copy(bulb.position);
    scene.add(bg);
    bulbs.push({ mat: bm, glow: bg, idx: bulbs.length, br: 0 });
  }
}

// 下半张脸往里收、下巴略尖（动画脸型）
function shapeHead(g, r = HEAD_R) {
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const ny = y / r;
    if (ny < 0.15) {
      const t = Math.min(1, (0.15 - ny) / 1.15);
      x *= 1 - 0.42 * Math.pow(t, 1.25);
      z *= 1 - 0.12 * t;
      if (z > 0) z += 0.1 * r * t * t;             // 下巴往前收出尖
      y -= 0.04 * r * t * t;
    }
    p.setXYZ(i, x * 0.93, y * 1.04, z);
  }
  g.computeVertexNormals();
  return g;
}

// 点到线段的距离 < r 则视为路径会撞上障碍
function segHitsCircle(ax, az, bx, bz, cx, cz, r) {
  const abx = bx - ax, abz = bz - az;
  const len2 = abx * abx + abz * abz || 1e-6;
  let u = ((cx - ax) * abx + (cz - az) * abz) / len2;
  u = Math.max(0, Math.min(1, u));
  const dx = ax + abx * u - cx, dz = az + abz * u - cz;
  return dx * dx + dz * dz < r * r;
}
function pickTarget() {
  const px = girl.position.x, pz = girl.position.z;
  // 一半概率去固定活动点：池塘看鱼 / 坐长椅 / 荡秋千 / 回房休息
  walk.spot = null;
  if (Math.random() < 0.5) {
    const spot = SPOTS[(Math.random() * SPOTS.length) | 0];
    if (Math.hypot(spot.ax - px, spot.az - pz) > 1.2) {
      let ok = true;
      for (const [cx, cz, r] of OBSTACLES)
        if (segHitsCircle(px, pz, spot.ax, spot.az, cx, cz, r)) { ok = false; break; }
      if (ok) { walk.spot = spot; walk.target.set(spot.ax, spot.az); return; }
    }
  }
  for (let tries = 0; tries < 40; tries++) {
    const x = WALK_BOUNDS.minX + Math.random() * (WALK_BOUNDS.maxX - WALK_BOUNDS.minX);
    const z = WALK_BOUNDS.minZ + Math.random() * (WALK_BOUNDS.maxZ - WALK_BOUNDS.minZ);
    let ok = true;
    for (const [cx, cz, r] of OBSTACLES) {
      if (Math.hypot(x - cx, z - cz) < r + 0.35 || segHitsCircle(px, pz, x, z, cx, cz, r + 0.3)) {
        ok = false; break;
      }
    }
    if (ok && Math.hypot(x - px, z - pz) > 3) {   // 太近的点不值得走
      walk.target.set(x, z);
      return;
    }
  }
  walk.target.set(0, 6);   // 兜底：到院子中央附近
}
function lerpAngle(a, b, k) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * k;
}

function startActivity(spot, t) {
  walk.fromPos = girl.position.clone();
  walk.fromRotY = girl.rotation.y;
  walk.approachPos = girl.position.clone();
  walk.approachRotY = girl.rotation.y;
  walk.blend = 0;
  if (spot.kind === 'bench') {
    walk.state = 'sit';
    walk.toPos = new THREE.Vector3(BENCH_SIT.x, BENCH_SIT.y, BENCH_SIT.z);
    walk.toRotY = BENCH_SIT.rotY;
    walk.actUntil = t + 9 + Math.random() * 8;
  } else if (spot.kind === 'swing') {
    walk.state = 'toSwing';
    walk.toPos = new THREE.Vector3(6.35, 0, -2.9);  // 秋千坐垫摆动路径旁站好
    walk.toRotY = Math.atan2(5.08 - walk.fromPos.x, -2.9 - walk.fromPos.z);
    walk.actUntil = t + 10 + Math.random() * 8;
    walk.hopT = -1;                                  // -1 = 还在等秋千荡回来
  } else if (spot.kind === 'pond') {
    walk.state = 'watch';
    walk.actUntil = t + 6 + Math.random() * 7;
    walk.heading = Math.atan2(5 - walk.fromPos.x, 4 - walk.fromPos.z);   // 面向池塘
  } else {   // house
    walk.state = 'enter';
    walk.toPos = new THREE.Vector3(DOOR_POS.x, 0, DOOR_POS.z);
    walk.toRotY = Math.atan2(DOOR_POS.x - walk.fromPos.x, DOOR_POS.z - walk.fromPos.z);
    walk.actUntil = t + 12 + Math.random() * 12;
  }
}

  legL.rotation.z = legR.rotation.z = 0;
}

function resolveRoomClip(x, z, r) {
  for (const [x1, x2, z1, z2] of ROOM_SOLID) {
    if (x > x1 - r && x < x2 + r && z > z1 - r && z < z2 + r) {
      const dx1 = x - (x1 - r), dx2 = (x2 + r) - x, dz1 = z - (z1 - r), dz2 = (z2 + r) - z;
      const m = Math.min(dx1, dx2, dz1, dz2);
      if (m === dx1) x = x1 - r; else if (m === dx2) x = x2 + r;
      else if (m === dz1) z = z1 - r; else z = z2 + r;
    }
  }
  return [Math.max(-4.05, Math.min(4.05, x)), Math.max(-2.95, Math.min(2.95, z))];
}

/* ---------- 进出室内：相机过渡（位置 / 朝向 / FOV） ---------- */
const CAM_TRANSIT_DUR = 0.5;
let camTransit = null;   // { kind, t, dur, fromPos, toPos, fromQuat, toQuat, fromFov, toFov, fromNear, toNear }
const _camEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const _camLookMat = new THREE.Matrix4();
const _camToQuat = new THREE.Quaternion();

function easeInOutCubic(u) {
  return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
}
function indoorEyePos(out) {
  return out.set(HP.x + camL.x * 0.5, 0.92, HP.z + camL.z * 0.5);
}
function quatFromYawPitch(yaw, pitch, out) {
  _camEuler.set(pitch, yaw, 0, 'YXZ');
  return out.setFromEuler(_camEuler);
}
function quatLookAt(from, target, out) {
  _camLookMat.lookAt(from, target, UP_Y);
  return out.setFromRotationMatrix(_camLookMat);
}

function beginCamTransit(kind) {
  const fromPos = camera.position.clone();
  const fromQuat = camera.quaternion.clone();
  const fromFov = camera.fov;
  const fromNear = camera.near;
  const toPos = new THREE.Vector3();
  const toQuat = new THREE.Quaternion();
  let toFov, toNear;
  if (kind === 'enter') {
    indoorEyePos(toPos);
    quatFromYawPitch(interiorCam.yaw, interiorCam.pitch, toQuat);
    toFov = 52; toNear = 0.06;
  } else {
    toPos.copy(interiorCam.pos);
    quatLookAt(toPos, interiorCam.target, toQuat);
    toFov = 40; toNear = 0.1;
  }
  camTransit = {
    kind, t: 0, dur: CAM_TRANSIT_DUR,
    fromPos, toPos, fromQuat, toQuat, fromFov, toFov, fromNear, toNear
  };
}

function finishCamTransit() {
  const kind = camTransit.kind;
  camTransit = null;
  if (kind === 'enter') {
    interiorMode = true;
    camera.fov = 52;
    camera.near = 0.06;
    camera.updateProjectionMatrix();
    camera.rotation.order = 'YXZ';
    camera.rotation.set(interiorCam.pitch, interiorCam.yaw, 0);
    indoorEyePos(camera.position);
    syncTouchChrome(true);
    showIndoorSessionHint();
  } else {
    interiorMode = false;
    camera.fov = 40;
    camera.near = 0.1;
    camera.updateProjectionMatrix();
    camera.position.copy(interiorCam.pos);
    controls.target.copy(interiorCam.target);
    controls.enabled = true;
    controls.update();
    syncTouchChrome(false);
    hint.style.display = '';
  }
}

function updateCamTransit(delta) {
  if (!camTransit) return;
  camTransit.t += delta;
  const u = Math.min(1, camTransit.t / camTransit.dur);
  const k = easeInOutCubic(u);
  camera.position.lerpVectors(camTransit.fromPos, camTransit.toPos, k);
  _camToQuat.copy(camTransit.fromQuat).slerp(camTransit.toQuat, k);
  camera.quaternion.copy(_camToQuat);
  camera.fov = THREE.MathUtils.lerp(camTransit.fromFov, camTransit.toFov, k);
  camera.near = THREE.MathUtils.lerp(camTransit.fromNear, camTransit.toNear, k);
  camera.updateProjectionMatrix();
  if (u >= 1) finishCamTransit();
}

/* ---------- 室内触控：左半屏移动 / 右半屏环视 + 首次引导 ---------- */
const vpad = document.getElementById('vpad');
const vpadKnob = document.getElementById('vpadKnob');
const lookZone = document.getElementById('lookZone');
const touchMove = { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 };
const touchLook = { active: false, id: -1, lx: 0, ly: 0 };
let indoorHintShown = false;
let indoorHintTimer = 0;
const IHINT_DESKTOP = '🏠 WASD / 方向键 走动 · 按住拖拽 环视 · 点门离开 · ESC 或点「回到院子」';
const IHINT_TOUCH = '🏠 左半屏滑动走动 · 右半屏拖拽环视 · 点门离开 · 「回到院子」';

function needsIndoorTouch() {
  try {
    if (matchMedia('(pointer: coarse)').matches) return true;
    if (matchMedia('(hover: none)').matches) return true;
  } catch (_) {}
  return innerWidth <= 640;
}
function syncTouchChrome(on) {
  const show = !!(on && needsIndoorTouch());
  vpad.classList.toggle('on', show);
  lookZone.classList.toggle('on', show);
  if (!show) resetVpadKnob();
}
function resetVpadKnob() {
  touchMove.x = 0; touchMove.y = 0;
  if (vpadKnob) vpadKnob.style.transform = 'translate(-50%, -50%)';
}
function setVpadKnob(dx, dy) {
  const max = Math.min(vpad.clientWidth, vpad.clientHeight) * 0.28 || 30;
  vpadKnob.style.transform = 'translate(calc(-50% + ' + (dx * max) + 'px), calc(-50% + ' + (dy * max) + 'px))';
}
function hideIndoorHint() {
  if (ihint.style.display === 'none' || ihint.classList.contains('hide')) return;
  ihint.classList.add('hide');
  clearTimeout(indoorHintTimer);
  indoorHintTimer = setTimeout(() => {
    ihint.style.display = 'none';
    ihint.classList.remove('hide');
  }, 480);
}
function noteIndoorInput() {
  if (indoorHintShown && ihint.style.display !== 'none') hideIndoorHint();
}
function showIndoorSessionHint() {
  if (indoorHintShown) return;
  indoorHintShown = true;
  ihint.textContent = needsIndoorTouch() ? IHINT_TOUCH : IHINT_DESKTOP;
  ihint.classList.remove('hide');
  ihint.style.display = '';
  clearTimeout(indoorHintTimer);
  indoorHintTimer = setTimeout(hideIndoorHint, 4000);
}

function enterInterior() {
  if (interiorMode || (camTransit && camTransit.kind === 'enter')) return;
  if (camTransit && camTransit.kind === 'exit') camTransit = null;
  controls.enabled = false;
  controls.update();
  interiorCam.pos.copy(camera.position);
  interiorCam.target.copy(controls.target);
  camera.lookAt(interiorCam.target);  // 同步 quaternion，过渡起点不跳
  camL.x = -3.2; camL.z = 0.4;
  interiorCam.yaw = 0;      // 起居室对着后窗，平视院子
  interiorCam.pitch = -0.16;
  setShellWallsVisible(false);   // 藏起外壳墙，避免双层墙的侧边把窗洞填成米色板
  btnExit.style.display = '';
  hint.style.display = 'none';
  ihint.style.display = 'none';
  ihint.classList.remove('hide');
  beginCamTransit('enter');
}
function exitInterior() {
  if (camTransit && camTransit.kind === 'exit') return;
  if (!interiorMode && !(camTransit && camTransit.kind === 'enter')) return;
  // 打断进屋过渡：从当前插值位置回到院子
  if (camTransit && camTransit.kind === 'enter') camTransit = null;
  interiorMode = false;
  controls.enabled = false;
  clearTimeout(indoorHintTimer);
  ihint.style.display = 'none';
  ihint.classList.remove('hide');
  btnExit.style.display = 'none';
  setShellWallsVisible(true);
  syncTouchChrome(false);
  touchMove.active = false; touchLook.active = false;
  resetVpadKnob();
  beginCamTransit('exit');
}
btnExit.addEventListener('click', () => exitInterior());
addEventListener('keydown', e => {
  roomKeys[e.key.toLowerCase()] = true;
  if (interiorMode && !camTransit && (roomKeys['w'] || roomKeys['a'] || roomKeys['s'] || roomKeys['d'] ||
      roomKeys['arrowup'] || roomKeys['arrowdown'] || roomKeys['arrowleft'] || roomKeys['arrowright'])) {
    noteIndoorInput();
  }
  if (e.key === 'Escape' && (interiorMode || (camTransit && camTransit.kind === 'enter'))) exitInterior();
});

/* ---------- 小女孩在屋里的随机小动作（卧室 / 起居室 / 厨房三个房间） ---------- */
const iGirl = { state: 'walk', path: [], act: null, until: 0, blend: 0, phase: 0,
  fromPos: new THREE.Vector3(), fromRotY: 0, seatPos: new THREE.Vector3(), seatRotY: 0 };
const ROOM_SPOTS = [
  { x: 0.4, z: 2.4, act: 'window', px: 0.4, py: 0, pz: 2.55, ry: 1.05 },            // 卧室窗前看前院
  { x: -3.42, z: -1.25, act: 'chair', px: -3.42, py: 0.48 - GIRL_SEAT_DROP * GIRL_SCALE_IN, pz: -1.45, ry: Math.PI },  // 坐到书桌前（椅面 0.48）
  { x: 1.9, z: 0.5, act: 'bed', px: 1.9, py: 0.61 - GIRL_SEAT_DROP * GIRL_SCALE_IN, pz: 1.3, ry: Math.PI },  // 坐床沿（被面 0.61）
  { x: 3.3, z: -1.3, act: 'counter', px: 3.3, py: 0, pz: -0.8, ry: Math.PI / 2 },   // 厨房台前忙活
  { x: -3.9, z: 2.85, act: 'shelf', px: -3.9, py: 0, pz: 2.9, ry: 0 },              // 书架前挑书
];
// 三个房间的跨房间路径：先走到门洞两侧，再进目标房间
function roomOf(x) { return x < -1.2 ? 0 : (x > 3.2 ? 2 : 1); }
function routeTo(fx, fz, tx, tz) {
  const rf = roomOf(fx), rt = roomOf(tx);
  const dB = [-1.55, 1.0], dA = [-0.85, 1.0];     // 起居室|卧室门洞两侧
  const dC = [2.85, -1.8], dD = [3.55, -1.8];     // 卧室|厨房门洞两侧
  const p = [];
  if (rf !== rt) {
    if (rf === 0 && rt === 1) p.push(dB, dA);
    else if (rf === 1 && rt === 0) p.push(dA, dB);
    else if (rf === 1 && rt === 2) p.push(dC, dD);
    else if (rf === 2 && rt === 1) p.push(dD, dC);
    else if (rf === 0 && rt === 2) p.push(dB, dA, dC, dD);
    else p.push(dD, dC, dA, dB);
  }
  p.push([tx, tz]);
  return p;
}
function updateInteriorGirl(delta, t, holdUmb) {
  if (iGirl.state === 'walk') {
    if (!iGirl.path.length) {   // 到位 → 开始小动作
      const sp = ROOM_SPOTS.find(sp => sp.act === iGirl.act) || ROOM_SPOTS[0];
      iGirl.fromPos.copy(girl.position);
      iGirl.fromRotY = girl.rotation.y;
      iGirl.seatPos.set(sp.px, sp.py, sp.pz);
      iGirl.seatRotY = sp.ry;
      iGirl.blend = 0;
      iGirl.until = t + 3.5 + Math.random() * 5;
      iGirl.state = 'act';
      return;
    }
    const [wx, wz] = iGirl.path[0];
    const dx = wx - girl.position.x, dz = wz - girl.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.16) { iGirl.path.shift(); return; }
    const st = Math.min(0.62 * delta, d);
    // x / z 分轴移动：对角线被家具挡住时自动沿空闲轴滑行，不会卡在拐角
    let nx = girl.position.x + (dx / d) * st;
    let nz = girl.position.z;
    [nx, nz] = resolveRoomClip(nx, nz, 0.24);
    let nz2 = girl.position.z + (dz / d) * st;
    [nx, nz2] = resolveRoomClip(nx, nz2, 0.24);
    girl.position.x = nx;
    girl.position.z = nz2;
    girl.rotation.y = lerpAngle(girl.rotation.y, Math.atan2(dx, dz), Math.min(1, delta * 7));
    iGirl.phase += delta * 6.8;
    const sw = Math.sin(iGirl.phase);
    legL.rotation.x = sw * 0.5; legR.rotation.x = -sw * 0.5;
    armL.rotation.x = -sw * 0.3;
    if (!holdUmb) armR.rotation.x = sw * 0.3;
    girl.position.y = Math.abs(sw) * 0.028;
  } else {
    iGirl.blend = Math.min(1, iGirl.blend + delta * 2.5);
    const b = iGirl.blend * iGirl.blend * (3 - 2 * iGirl.blend);
    girl.position.lerpVectors(iGirl.fromPos, iGirl.seatPos, b);
    girl.rotation.y = lerpAngle(iGirl.fromRotY, iGirl.seatRotY, b);
    if (iGirl.act === 'chair' || iGirl.act === 'bed') {
      girl.position.y += Math.sin(b * Math.PI) * 0.1;
      legL.rotation.x = legR.rotation.x = -1.4 * b;      // 坐下：腿前伸
      armL.rotation.x = -0.5 * b;
      if (!holdUmb) armR.rotation.x = -0.5 * b;
      head.rotation.y = Math.sin(t * 0.5) * 0.15 * b;
      head.rotation.x = 0.03;
    } else {                                             // 窗前 / 厨房台前 / 书架前：站着张望
      legL.rotation.x = legR.rotation.x = 0;
      armL.rotation.x = -0.1 * b;
      if (!holdUmb) armR.rotation.x = -0.1 * b;
      head.rotation.x = 0.1 * b;
      head.rotation.y = Math.sin(t * 0.45) * 0.18 * b;
    }
    girl.position.y += Math.abs(Math.sin(t * 2)) * 0.006;
    if (t > iGirl.until && iGirl.blend >= 1) {           // 换下一个活动（可跨房间）
      const others = ROOM_SPOTS.filter(sp => sp.act !== iGirl.act);
      const sp = others[(Math.random() * others.length) | 0];
      iGirl.act = sp.act;
      iGirl.path = routeTo(girl.position.x, girl.position.z, sp.x, sp.z);
      iGirl.state = 'walk';
      girl.position.y = 0;
      legL.rotation.z = legR.rotation.z = 0;
    }
  }
}

    for (const [ax, az, ar] of BUNNY_AVOID)

    if (ok && Math.hypot(x - bx, z - bz) > 1.4) { bunnyState.tx = x; bunnyState.tz = z; return; }
  }
  bunnyState.tx = -8.6; bunnyState.tz = 7.4;
}

function tzParts(tz) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  }).formatToParts(new Date());
}
function cityHourFrac(tz) {
  const p = tzParts(tz);
  const n = t => +p.find(x => x.type === t).value;
  return n('hour') + n('minute') / 60 + n('second') / 3600;
}
function cityHM(tz) {
  const p = tzParts(tz);
  const s = t => p.find(x => x.type === t).value;
  return s('hour') + ':' + s('minute');
}

function envFromHour(h) {
  if (h >= 6 && h < 18) return 0;
  if (h >= 19 || h < 5) return 1;
  return h < 6 ? 1 - (h - 5) : h - 18;
}

function weatherKind(code) {
  const c = code | 0;
  if (c === 45 || c === 48) return 'fog';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || (c >= 95 && c <= 99)) return 'rain';
  if (c === 2 || c === 3) return 'cloudy';
  return 'clear';
}

function applyWeatherKind(kind, cloudCover) {
  const cc = cloudCover == null ? (kind === 'clear' ? 15 : 70) : cloudCover;
  weather.kind = kind;
  if (kind === 'clear') Object.assign(weatherGoal, { sun: 1.12, cloudGray: 0.05, fog: 0, wet: 0 });
  else if (kind === 'cloudy') Object.assign(weatherGoal, { sun: 0.62, cloudGray: 0.55, fog: 0, wet: 0 });
  else if (kind === 'rain') Object.assign(weatherGoal, { sun: 0.48, cloudGray: 0.7, fog: 0.08, wet: 1 });
  else if (kind === 'snow') Object.assign(weatherGoal, { sun: 0.7, cloudGray: 0.45, fog: 0.12, wet: 0.15 });
  else if (kind === 'fog') Object.assign(weatherGoal, { sun: 0.4, cloudGray: 0.35, fog: 1, wet: 0.2 });
  rainLines.visible = kind === 'rain';
  rainPoints.visible = kind === 'rain';
  snowPoints.visible = kind === 'snow';
  for (const g of stormClouds) g.visible = (kind === 'rain' || kind === 'cloudy' || kind === 'snow');
  void cc;
  // 时钟栏天气文字
  const wxEl = document.getElementById('clockWx');
  if (wxEl) wxEl.textContent = ' ' + (WX_NAMES[kind] || '');
  // 雨停了 → 待会儿出现彩虹（夜间则等天亮再说）
  if (prevWxKind === 'rain' && kind !== 'rain') rainbowPending = true;
  prevWxKind = kind;
}

async function fetchWeather(city) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=weather_code,temperature_2m,is_day,precipitation,cloud_cover,wind_speed_10m&timezone=auto`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('wx http ' + r.status);
    const j = await r.json();
    const cur = j.current || {};
    if (cur.weather_code == null && cur.temperature_2m == null) throw new Error('wx empty');
    weather.temp = cur.temperature_2m;
    weather.code = cur.weather_code;
    weather.cloud = cur.cloud_cover;
    applyWeatherKind(weatherKind(cur.weather_code), cur.cloud_cover);
    const el = document.getElementById('clockTemp');
    if (el && weather.temp != null) el.textContent = Math.round(weather.temp) + '°';
  } catch (e) {
    // 非阻塞提示；保留上次天气/天空，失败前无数据则继续默认 clear
    const wxEl = document.getElementById('clockWx');
    if (wxEl) wxEl.textContent = ' 天气暂不可用';
  }
}

function makeNoiseBuffer(ctx, seconds = 2.5) {
  const n = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.02 * white) / 1.02; // soft brown-ish
    d[i] = last * 3.5;
  }
  return buf;
}

function buildAmbientGraph(ctx) {
  masterGain = ctx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ctx.destination);

  const noiseBuf = makeNoiseBuffer(ctx);

  // Soft wind
  const windSrc = ctx.createBufferSource();
  windSrc.buffer = noiseBuf;
  windSrc.loop = true;
  const windFilter = ctx.createBiquadFilter();
  windFilter.type = 'lowpass';
  windFilter.frequency.value = 380;
  windFilter.Q.value = 0.4;
  windGain = ctx.createGain();
  windGain.gain.value = 0.035;
  windSrc.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(masterGain);
  const windLfo = ctx.createOscillator();
  windLfo.type = 'sine';
  windLfo.frequency.value = 0.07;
  const windLfoG = ctx.createGain();
  windLfoG.gain.value = 90;
  windLfo.connect(windLfoG);
  windLfoG.connect(windFilter.frequency);
  windSrc.start();
  windLfo.start();

  // Light rain (brighter band-limited noise)
  const rainSrc = ctx.createBufferSource();
  rainSrc.buffer = noiseBuf;
  rainSrc.loop = true;
  const rainFilter = ctx.createBiquadFilter();
  rainFilter.type = 'bandpass';
  rainFilter.frequency.value = 2400;
  rainFilter.Q.value = 0.55;
  rainGain = ctx.createGain();
  rainGain.gain.value = 0;
  rainSrc.playbackRate.value = 1.17;
  rainSrc.connect(rainFilter);
  rainFilter.connect(rainGain);
  rainGain.connect(masterGain);
  rainSrc.start();

  // Quiet night insects: bus + soft peeps
  insectGain = ctx.createGain();
  insectGain.gain.value = 0;
  insectGain.connect(masterGain);
  const bugSrc = ctx.createBufferSource();
  bugSrc.buffer = noiseBuf;
  bugSrc.loop = true;
  const bugBP = ctx.createBiquadFilter();
  bugBP.type = 'bandpass';
  bugBP.frequency.value = 5200;
  bugBP.Q.value = 10;
  const bugAmp = ctx.createGain();
  bugAmp.gain.value = 0.018;
  bugSrc.connect(bugBP);
  bugBP.connect(bugAmp);
  bugAmp.connect(insectGain);
  bugSrc.start();
  for (let i = 0; i < 2; i++) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 4100 + i * 780;
    const amp = ctx.createGain();
    amp.gain.value = 0;
    osc.connect(amp);
    amp.connect(insectGain);
    const cs = ctx.createConstantSource();
    cs.offset.value = 0.0035;
    cs.connect(amp.gain);
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.16 + i * 0.09;
    const lfoG = ctx.createGain();
    lfoG.gain.value = 0.0035;
    lfo.connect(lfoG);
    lfoG.connect(amp.gain);
    const chirp = ctx.createOscillator();
    chirp.type = 'sine';
    chirp.frequency.value = 5.2 + i * 1.4;
    const chirpG = ctx.createGain();
    chirpG.gain.value = 0.0022;
    chirp.connect(chirpG);
    chirpG.connect(amp.gain);
    osc.start(); cs.start(); lfo.start(); chirp.start();
  }
  audioBuilt = true;
}

async function ensureAmbientAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();
    buildAmbientGraph(audioCtx);
  }
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch (_) { return false; }
  }
  return true;
}

function duckAmbient(fast = false) {
  if (!masterGain || !audioCtx) return;
  masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, fast ? 0.05 : 0.12);
}

let _ambWant = { master: -1, wind: -1, rain: -1, insect: -1 };
function tickAmbientAudio() {
  if (!audioBuilt || !masterGain || !audioCtx) return;
  const now = audioCtx.currentTime;
  const on = audioWanted && !document.hidden;
  const masterT = on ? 1 : 0;
  if (masterT !== _ambWant.master) {
    _ambWant.master = masterT;
    masterGain.gain.setTargetAtTime(masterT, now, 0.18);
  }
  if (!on) {
    if (_ambWant.rain !== 0 && rainGain) { _ambWant.rain = 0; rainGain.gain.setTargetAtTime(0, now, 0.2); }
    if (_ambWant.insect !== 0 && insectGain) { _ambWant.insect = 0; insectGain.gain.setTargetAtTime(0, now, 0.2); }
    return;
  }
  if (windGain && _ambWant.wind !== 0.038) {
    _ambWant.wind = 0.038;
    windGain.gain.setTargetAtTime(0.038, now, 0.35);
  }
  const raining = (typeof weather !== 'undefined' && weather.kind === 'rain')
    || (typeof weatherMul !== 'undefined' && weatherMul.wet > 0.5);
  const rainT = raining ? 0.048 : 0;
  if (rainGain && rainT !== _ambWant.rain) {
    _ambWant.rain = rainT;
    rainGain.gain.setTargetAtTime(rainT, now, 0.45);
  }
  const night = (typeof env !== 'undefined' && env > 0.45);
  const insectT = night ? 1 : 0;
  if (insectGain && insectT !== _ambWant.insect) {
    _ambWant.insect = insectT;
    insectGain.gain.setTargetAtTime(insectT, now, 0.55);
  }
}

const popAnims = []; // { obj, t0, dur, base }
function triggerScalePop(obj, amp = 0.14, dur = 0.38) {
  if (!obj) return;
  const base = obj.userData.baseScale != null ? obj.userData.baseScale : (obj.scale.x || 1);
  obj.userData.baseScale = base;
  // 去掉同一物体旧动画
  for (let i = popAnims.length - 1; i >= 0; i--) if (popAnims[i].obj === obj) popAnims.splice(i, 1);
  popAnims.push({ obj, t0: clock.elapsedTime, dur, amp, base });
}
function updatePopAnims(t) {
  for (let i = popAnims.length - 1; i >= 0; i--) {
    const a = popAnims[i];
    const u = (t - a.t0) / a.dur;
    if (u >= 1) {
      a.obj.scale.setScalar(a.base);
      popAnims.splice(i, 1);
      continue;
    }
    const k = Math.sin(u * Math.PI); // 起落一弹
    a.obj.scale.setScalar(a.base * (1 + a.amp * k));
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const _doorHitPt = new THREE.Vector3();
const doorWorldBox = new THREE.Box3();
function setPointerFromClient(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  const w = r.width || innerWidth, h = r.height || innerHeight;
  pointer.set(((cx - r.left) / w) * 2 - 1, -((cy - r.top) / h) * 2 + 1);
}
function rayHitsDoorway() {
  const doorObjs = [roomExitDoor, doorG, doorExitHit].filter(Boolean);
  if (doorObjs.length && raycaster.intersectObjects(doorObjs, true).length) return true;
  if (doorExitHit) {
    doorExitHit.updateWorldMatrix(true, false);
    doorWorldBox.setFromObject(doorExitHit);
    if (raycaster.ray.intersectBox(doorWorldBox, _doorHitPt)) return true;
  }
  return false;
}
let downX = 0, downY = 0, lookX = 0, lookY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY; lookX = e.clientX; lookY = e.clientY;
  if (!interiorMode || camTransit) return;
  if (!needsIndoorTouch()) return;
  const mid = innerWidth * 0.5;
  if (e.clientX < mid) {
    // 左半屏：虚拟摇杆走动
    touchMove.active = true; touchMove.id = e.pointerId;
    touchMove.ox = e.clientX; touchMove.oy = e.clientY;
    touchMove.x = 0; touchMove.y = 0;
    setVpadKnob(0, 0);
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
  } else {
    // 右半屏：环视
    touchLook.active = true; touchLook.id = e.pointerId;
    touchLook.lx = e.clientX; touchLook.ly = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (camTransit || !interiorMode) return;
  if (touchMove.active && e.pointerId === touchMove.id) {
    const maxR = 52;
    let dx = e.clientX - touchMove.ox, dy = e.clientY - touchMove.oy;
    const len = Math.hypot(dx, dy) || 1;
    if (len > maxR) { dx *= maxR / len; dy *= maxR / len; }
    touchMove.x = dx / maxR;
    touchMove.y = dy / maxR;
    setVpadKnob(touchMove.x, touchMove.y);
    if (touchMove.x * touchMove.x + touchMove.y * touchMove.y > 0.01) noteIndoorInput();
    return;
  }
  if (touchLook.active && e.pointerId === touchLook.id) {
    interiorCam.yaw -= (e.clientX - touchLook.lx) * 0.0052;
    interiorCam.pitch = Math.max(-1.1, Math.min(0.5, interiorCam.pitch - (e.clientY - touchLook.ly) * 0.0042));
    touchLook.lx = e.clientX; touchLook.ly = e.clientY;
    noteIndoorInput();
    return;
  }
  if (!(e.buttons & 1)) return;   // 桌面：按住拖拽环视
  if (needsIndoorTouch()) return; // 触控路径走上面的双区
  interiorCam.yaw -= (e.clientX - lookX) * 0.0052;
  interiorCam.pitch = Math.max(-1.1, Math.min(0.5, interiorCam.pitch - (e.clientY - lookY) * 0.0042));
  lookX = e.clientX; lookY = e.clientY;
  noteIndoorInput();
});
function endTouchPointer(e) {
  if (touchMove.active && e.pointerId === touchMove.id) {
    touchMove.active = false; touchMove.id = -1;
    resetVpadKnob();

    touchLook.active = false; touchLook.id = -1;
  }

  if (moveDist > 6) return;

  if (raycaster.intersectObject(bunny, true).length) {

    bunnyState.until = clock.elapsedTime + 1.4;
    return;
  }
  // 室内家具点按（门射线已优先；不打断出门）
  if (interiorMode) {
    const hits = window.__furnitureHits || [];
    if (hits.length) {
      const fh = raycaster.intersectObjects(hits, false);
      if (fh.length) {
        const kind = fh[0].object.userData.furniture;
        if (kind) { onFurnitureClick(kind); return; }
      }
    }
    return;                                    // 室内其余点击不处理
  }
  // 院子微互动：向日葵 / 灯笼 / 锦鲤（先于点房子进屋）
  {
    const yardObjs = [...sunflowerGroups, ...lanternMeshes, ...kois.map(k => k.g)];
    const yh = raycaster.intersectObjects(yardObjs, true);
    if (yh.length) {
      let o = yh[0].object;
      while (o && !o.userData.yardKind && o.parent) o = o.parent;
      if (o && o.userData.yardKind) { onYardClick(o.userData.yardKind, o); return; }
    }

    enterInterior();                           // 点击房子 → 进屋看看
  }
