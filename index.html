<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小院时光 · A Little Courtyard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffe9d2;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #title {
    position: fixed; top: 26px; left: 30px; color: #7a5a3a; z-index: 10;
    text-shadow: 0 2px 10px rgba(255, 250, 240, .8); user-select: none; pointer-events: none;
  }
  #title h1 { font-size: 26px; font-weight: 700; letter-spacing: 6px; }
  #title p  { font-size: 12px; letter-spacing: 3px; opacity: .7; margin-top: 6px; }

  #hint {
    position: fixed; top: 32px; right: 30px; z-index: 10; color: #7a5a3a;
    font-size: 12px; letter-spacing: 1px;
    background: rgba(255,255,255,.5); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; user-select: none; pointer-events: none;
  }

  #panel {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    max-width: min(96vw, 980px); pointer-events: none;
    background: rgba(255,255,255,.45); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.7); border-radius: 999px; padding: 8px;
    box-shadow: 0 8px 30px rgba(160, 110, 60, .18);
  }
  #panel button, #panel select { pointer-events: auto; }
  #panel button {
    border: none; cursor: pointer; border-radius: 999px; padding: 9px 20px;
    font-size: 13px; letter-spacing: 2px; color: #7a5a3a;
    background: rgba(255,255,255,.85); transition: all .25s ease;
    font-family: inherit;
  }
  #panel button:hover { background: #fff; transform: translateY(-1px); }
  #panel button.active { background: #c96f4a; color: #fff; box-shadow: 0 4px 14px rgba(200, 110, 70, .45); }
  #panel select {
    border: none; cursor: pointer; border-radius: 999px; padding: 9px 16px 9px 18px;
    font-size: 13px; letter-spacing: 2px; color: #7a5a3a;
    background: rgba(255,255,255,.85); font-family: inherit;
    outline: none; appearance: none; -webkit-appearance: none;
  }
  #panel select:hover { background: #fff; }
  #clock {
    position: fixed; top: 72px; left: 30px; z-index: 10; color: #7a5a3a;
    font-size: 13px; letter-spacing: 2px;
    background: rgba(255,255,255,.5); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; user-select: none; pointer-events: none;
  }
  #clock .temp { opacity: .7; font-size: 12px; margin-left: 8px; letter-spacing: 1px; }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(#ffe3c2, #fff3e4); color: #7a5a3a;
    transition: opacity .8s ease; letter-spacing: 4px; font-size: 14px;
  }
  #loading .sun {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffedbd, #ffb36b);
    box-shadow: 0 0 40px #ffc98a; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  #loading.hide { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    #title h1 { font-size: 20px; letter-spacing: 3px; }
    #hint { display: none; }
    #panel button { padding: 8px 14px; font-size: 12px; }
    #clock { top: 58px; left: 16px; font-size: 12px; }
    #panel select { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1>小院时光</h1>
  <p>A LITTLE COURTYARD · 3D DIORAMA</p>
</div>
<div id="hint">🖱 拖拽旋转 · 滚轮缩放 · 右键平移 · 点一点小女孩 / 小猫 / 小兔</div>
<div id="clock"><span id="clockTime">北京 --:--</span><span class="temp" id="clockWx"></span><span class="temp" id="clockTemp"></span></div>
<div id="panel">
  <select id="citySelect" aria-label="城市"></select>
  <button id="btnDay">🌙 夜晚</button>
  <button id="btnRotate">🔄 自动旋转</button>
</div>
<div id="loading"><div class="sun"></div><div>正在准备小院子…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   基础：渲染器 / 场景 / 相机 / 控制器（微缩景观视角）
============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf0e0cc, 0.0);

// 环境贴图：给水、石等 PBR 材质带来柔和的反射层次
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
camera.position.set(19, 17, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.addEventListener('start', () => {
  if (controls.autoRotate) { controls.autoRotate = false; btnRotate.classList.remove('active'); }
});

/* ============================================================
   光照（暖调、柔和）
============================================================ */
const hemi = new THREE.HemisphereLight(0xfff0d8, 0x9cb97a, 1.0);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffe8d0, 0.32);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffe0b0, 1.9);
sun.position.set(26, 34, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -21; sun.shadow.camera.right = 21;
sun.shadow.camera.top = 21;   sun.shadow.camera.bottom = -21;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// 反方向的冷色补光，增强体积感
const fillLight = new THREE.DirectionalLight(0x9db8ff, 0.35);
fillLight.position.set(-24, 14, -20);
scene.add(fillLight);

/* ============================================================
   背景（奶油色渐变球，衬托悬浮小岛）、太阳 / 月亮、星星
============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    topColor:    { value: new THREE.Color(0xffce9e) },
    bottomColor: { value: new THREE.Color(0xfff6e8) },
  },
  vertexShader: `
    varying vec3 vPos;
    void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec3 vPos;
    uniform vec3 topColor; uniform vec3 bottomColor;
    void main() {
      float h = normalize(vPos).y;
      gl_FragColor = vec4(mix(bottomColor, topColor, smoothstep(-0.1, 0.7, h)), 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), skyMat));

const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(6, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xffdda0, transparent: true, fog: false })
);
sunDisc.position.set(85, 55, -75);
scene.add(sunDisc);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(5, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xf4f7ff, transparent: true, opacity: 0, fog: false })
);
moon.position.set(-65, 52, 45);
scene.add(moon);

// 星星
const starGeo = new THREE.BufferGeometry();
{
  const pos = [];
  for (let i = 0; i < 320; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.42;
    const r = 170;
    pos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi) + 5, r * Math.sin(phi) * Math.sin(theta));
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, transparent: true, opacity: 0, fog: false, sizeAttenuation: true });
scene.add(new THREE.Points(starGeo, starMat));

/* ============================================================
   材质工具
============================================================ */
function makeGradient() {
  const c = new Uint8Array([100, 160, 215, 255]);
  const t = new THREE.DataTexture(c, c.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const GRAD = makeGradient();
const mat = (color, opts = {}) => new THREE.MeshToonMaterial({ color, gradientMap: GRAD, ...opts });
// 夜晚光晕精灵的登记表
const bulbGlows = [], lanternGlows = [], windowGlows = [];
// 柔光圆点贴图（炊烟 / 光晕 / 流星共用）
const smokeTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,.85)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

/* ---------- 毛茸茸外壳（多层 alphaTest 斑点壳）---------- */
function makeFurTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x2 = c.getContext('2d');
  x2.fillStyle = '#000'; x2.fillRect(0, 0, 128, 128);
  x2.strokeStyle = '#fff';
  for (let i = 0; i < 1500; i++) {
    const px = Math.random() * 128, py = Math.random() * 128;
    const ang = Math.random() * Math.PI * 2, ln = 2.5 + Math.random() * 5;
    x2.lineWidth = Math.random() < 0.55 ? 1 : 1.8;
    x2.beginPath();
    x2.moveTo(px, py);
    x2.lineTo(px + Math.cos(ang) * ln, py + Math.sin(ang) * ln);
    x2.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const FUR_TEX = makeFurTex();

function fluffify(target, opts = {}) {
  const { layers = 6, growth = 0.075, tint = 0 } = opts;
  const baseCol = target.material.color;
  for (let k = 1; k <= layers; k++) {
    const sm = new THREE.MeshToonMaterial({
      color: baseCol.clone().lerp(new THREE.Color(0xffffff), tint * (k / layers)),
      gradientMap: GRAD,
      alphaMap: FUR_TEX,
      alphaTest: 0.42
    });
    const sh = new THREE.Mesh(target.geometry, sm);
    sh.scale.setScalar(1 + growth * k);
    sh.castShadow = false;
    target.add(sh);
  }
}

function mesh(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, s = 16) => new THREE.CylinderGeometry(rt, rb, h, s);
const sph = (r, s = 20) => new THREE.SphereGeometry(r, s, Math.max(8, s * 0.6));

/* ============================================================
   浮空小岛平台（圆角草皮 + 泥土层 + 岩石层）
============================================================ */
function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d);
  s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function extrudeRounded(w, d, r, depth) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, d, r), {
    depth, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.16, bevelSegments: 3, curveSegments: 10
  });
  geo.rotateX(-Math.PI / 2);   // 平放，形状平面 → xz
  return geo;                  // y ∈ [-depth - bevel, +bevel]
}

const grassMat = mat(0x8ec963);
const dirtMat = new THREE.MeshStandardMaterial({ color: 0x84573c, roughness: 0.95, metalness: 0 });
const rockMat = new THREE.MeshStandardMaterial({ color: 0x6f635a, roughness: 0.9, metalness: 0 });

const diorama = new THREE.Group();
scene.add(diorama);

// 草皮层（顶面 y = 0，倒角让边缘圆润）
{
  const g = mesh(extrudeRounded(27, 23, 3.2, 0.45), grassMat, 0, -(0.45 + 0.16), 0);
  g.castShadow = false;
  diorama.add(g);
}
// 泥土层
diorama.add(mesh(extrudeRounded(25.4, 21.4, 2.8, 1.5), dirtMat, 0, -2.38, 0));
// 岩石底座
diorama.add(mesh(extrudeRounded(21, 17.5, 3.4, 1.1), rockMat, 0, -3.73, 0));
// 底部垂坠的水滴状岩石
for (let i = 0; i < 6; i++) {
  const ang = (i / 6) * Math.PI * 2 + 0.3;
  const cr = 3.2 + Math.random() * 2.4;
  const spk = mesh(sph(1.3 + Math.random() * 0.7, 13), rockMat,
    Math.cos(ang) * cr, -4.7 - Math.random() * 0.9, Math.sin(ang) * cr * 0.82);
  spk.scale.y = 2.3 + Math.random() * 0.8;
  spk.rotation.set((Math.random() - .5) * 0.4, Math.random() * 3, (Math.random() - .5) * 0.4);
  diorama.add(spk);
}
// 层间碎石带（草皮-泥土、泥土-岩石交界处）
for (let i = 0; i < 22; i++) {
  const a = Math.random() * Math.PI * 2;
  const band = [-0.78, -2.32, -2.62][i % 3];
  const st = mesh(sph(0.18 + Math.random() * 0.2, 12), rockMat,
    Math.cos(a) * (12.2 + Math.random() * 0.55),
    band - Math.random() * 0.2,
    Math.sin(a) * (10.2 + Math.random() * 0.5));
  st.scale.y = 0.72;
  diorama.add(st);
}
// 垂下来的小藤蔓
for (let i = 0; i < 8; i++) {
  const a = Math.random() * Math.PI * 2;
  const rx = 12.9, rz = 10.9;
  const v = mesh(new THREE.ConeGeometry(0.09, 0.5 + Math.random() * 0.4, 6), mat(0x5faf58),
    Math.cos(a) * rx, -0.75, Math.sin(a) * rz);
  v.rotation.x = Math.PI;
  diorama.add(v);
}

// 院内草坪：圆角矩形，与方形草皮层边缘完全齐平
const innerGround = mesh(new THREE.ShapeGeometry(roundedRectShape(26.7, 22.7, 3.05)), mat(0x7fbf58), 0, 0.02, 0);
innerGround.rotation.x = -Math.PI / 2;
innerGround.castShadow = false;
diorama.add(innerGround);

// 草坪深浅色斑，打破单调
const lawnPatchCols = [0x74b24e, 0x8cc961, 0x68a947];
for (let i = 0; i < 10; i++) {
  const px = -12 + Math.random() * 24, pz = -10 + Math.random() * 20;
  if (Math.hypot((px - 5) / 2.8, (pz - 4) / 2.2) < 1 || Math.hypot(px + 6.2, pz + 6.2) < 3.6) continue;
  const pat = mesh(new THREE.CircleGeometry(0.5 + Math.random() * 0.6, 18), mat(lawnPatchCols[i % 3]), px, 0.028 + i * 0.0008, pz);
  pat.rotation.x = -Math.PI / 2;
  pat.castShadow = false;
  diorama.add(pat);
}

// 周围悬浮的迷你小岛（在树木/花定义之后创建）
const floatingIslands = [];
function miniIsland(x, y, z, w, d, deco) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.add(mesh(extrudeRounded(w, d, 1.0, 0.3), grassMat, 0, -(0.3 + 0.16), 0));
  g.add(mesh(extrudeRounded(w - 0.8, d - 0.8, 0.8, 0.7), dirtMat, 0, -1.3, 0));
  g.add(mesh(extrudeRounded(w - 2.2, d - 2.2, 0.8, 0.5), rockMat, 0, -2.12, 0));
  deco(g);
  g.userData.baseY = y;
  g.userData.phase = Math.random() * 6;
  floatingIslands.push(g);
  scene.add(g);
}

// 白云（高空飘过）
const clouds = [];
const cloudMat = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: GRAD });
const CAM_AZ = Math.atan2(19, 21);   // 初始相机 (19, 17, 21) 的方位角
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group();
  const n = 3 + Math.floor(Math.random() * 3);
  for (let j = 0; j < n; j++) {
    const s = 1.2 + Math.random() * 1.6;
    const m = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), cloudMat);
    m.position.set(j * 1.7 - n * 0.85 + Math.random(), Math.random() * 0.6, Math.random() * 1.2 - 0.6);
    m.scale.y = 0.6;
    g.add(m);
  }
  // 云环避开初始相机方位角，防止开屏时云团糊在镜头上
  const a = CAM_AZ + 1.0 + Math.random() * (Math.PI * 2 - 2.0), r = 19 + Math.random() * 6;
  g.position.set(Math.cos(a) * r, 15 + Math.random() * 4, Math.sin(a) * r);
  g.scale.setScalar(0.8 + Math.random() * 0.5);
  g.scale.y *= 0.72;
  g.userData.speed = 0.25 + Math.random() * 0.3;
  g.userData.phase = Math.random() * 6;
  g.userData.storm = false;
  g.userData.baseScale = g.scale.x;
  clouds.push(g);
  scene.add(g);
}
const stormClouds = [];
const stormCloudMat = new THREE.MeshToonMaterial({ color: 0xb9c2cc, gradientMap: GRAD });
for (let i = 0; i < 5; i++) {
  const g = new THREE.Group();
  const n = 4 + Math.floor(Math.random() * 3);
  for (let j = 0; j < n; j++) {
    const s = 1.5 + Math.random() * 1.8;
    const m = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), stormCloudMat);
    m.position.set(j * 1.8 - n * 0.9 + Math.random(), Math.random() * 0.7, Math.random() * 1.4 - 0.7);
    m.scale.y = 0.55;
    g.add(m);
  }
  // 暴雨云低低悬在院子正上方（半径收进院子内圈），永远不会跑到相机附近
  const a = CAM_AZ + 1.0 + Math.random() * (Math.PI * 2 - 2.0), r = 8.5 + Math.random() * 6;
  g.position.set(Math.cos(a) * r, 7.5 + Math.random() * 2.5, Math.sin(a) * r);
  g.scale.setScalar(1.05 + Math.random() * 0.45);
  g.scale.y *= 0.7;
  g.userData.speed = 0.18 + Math.random() * 0.22;
  g.userData.phase = Math.random() * 6;
  g.userData.storm = true;
  g.visible = false;
  stormClouds.push(g);
  clouds.push(g);
  scene.add(g);
}

// 雨 / 雪粒子
function makeFallingPoints(count, color, size) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const spd = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i*3]     = (Math.random() - 0.5) * 48;
    pos[i*3 + 1] = Math.random() * 28;
    pos[i*3 + 2] = (Math.random() - 0.5) * 42;
    spd[i] = 0.6 + Math.random();
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size, transparent: true, opacity: 0.75, depthWrite: false, sizeAttenuation: true,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.visible = false;
  pts.userData.spd = spd;
  scene.add(pts);
  return pts;
}
const snowPoints = makeFallingPoints(800, 0xffffff, 0.42);
snowPoints.material.opacity = 0.95;
snowPoints.material.sizeAttenuation = true;

const RAIN_N = 1000;
const rainLen = new Float32Array(RAIN_N);
const rainSpd = new Float32Array(RAIN_N);
const rainPos = new Float32Array(RAIN_N * 6);
for (let i = 0; i < RAIN_N; i++) {
  const x = (Math.random() - 0.5) * 46;
  const y = Math.random() * 22;
  const z = (Math.random() - 0.5) * 40;
  const len = 0.42 + Math.random() * 0.5;
  rainLen[i] = len;
  rainSpd[i] = 16 + Math.random() * 12;
  rainPos[i * 6]     = x;

function picketRun(len) {
  const g = new THREE.Group();
  g.add(mesh(box(len, 0.07, 0.05), fenceWhite, 0, 0.22, 0));
  g.add(mesh(box(len, 0.07, 0.05), fenceWhite, 0, 0.46, 0));
  for (const ex of [-len / 2, len / 2]) {   // 端柱
    g.add(mesh(box(0.1, 0.68, 0.1), fenceWhite, ex, 0.34, 0));
    g.add(mesh(sph(0.07, 8), fenceWhite, ex, 0.71, 0));
  }
  const n = Math.floor(len / 0.65);
  for (let i = 0; i <= n; i++) {
    const x = -len / 2 + (i / n) * len;
    g.add(mesh(box(0.11, 0.6, 0.06), fenceWhite, x, 0.3, 0));
    g.add(mesh(sph(0.055, 8), fenceWhite, x, 0.6, 0));
  }
  return g;
}
function fence(len, x, z, ry) {
  const g = picketRun(len);
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  diorama.add(g);
}

const trees = [];

function makeTreeOn(parent, x, z, s = 1, leafType = 'green') {
  const tree = new THREE.Group();
  tree.position.set(x, 0, z);
  tree.add(mesh(cyl(0.2 * s, 0.34 * s, 2.6 * s, 9), trunkMat, 0, 1.3 * s, 0));
  // 斜出的分枝
  const limb = mesh(cyl(0.06 * s, 0.1 * s, 1.2 * s, 7), trunkMat, 0.5 * s, 2.1 * s, 0.18 * s);
  limb.rotation.z = -0.65; limb.rotation.x = 0.25;
  tree.add(limb);
  const foliage = new THREE.Group();
  foliage.position.y = 2.6 * s;
  const lm = leafMats[leafType];
  // 圆滚滚的绒球树冠
  const canopy = [
    [0, 0.7, 0, 1.32], [0.92, 0.3, 0.36, 0.92], [-0.88, 0.34, -0.3, 0.88],
    [0.55, 1.02, 0.5, 0.62], [-0.5, 0.98, 0.52, 0.6]
  ];
  for (const [ox, oy, oz, rr] of canopy) {
    foliage.add(mesh(sph(rr * s, 16), lm, ox * s, oy * s, oz * s));
  }
  // 统一不加顶帽：平涂渲染下第二色顶球总会形成突兀色块
  tree.add(foliage);
  tree.userData.foliage = foliage;
  tree.userData.phase = Math.random() * 6;
  parent.add(tree);
  return tree;
}

function sunflower(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.add(mesh(cyl(0.035 * s, 0.05 * s, 1.1 * s, 6), stemMat, 0, 0.55 * s, 0));
  // 花头独立转轴：白天朝向太阳，夜晚垂头
  const head = new THREE.Group();
  head.position.set(0, 1.15 * s, 0);
  head.add(mesh(sph(0.17 * s, 12), mat(0x6b4a2a), 0, 0, 0));
  const petalMat = mat(0xf9c94f);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const p = mesh(new THREE.ConeGeometry(0.05 * s, 0.2 * s, 5), petalMat,
      Math.cos(a) * 0.24 * s, 0, Math.sin(a) * 0.24 * s);
    p.rotation.z = -Math.PI / 2; p.rotation.y = -a;
    head.add(p);
  }
  g.add(head);
  diorama.add(g);
  head.userData = {
    ph: Math.random() * 6,
    droop: new THREE.Vector3(Math.random() - 0.5, -1.6, Math.random() - 0.5).normalize()
  };
  sunflowerHeads.push(head);
}
function makeDaisyOn(parent, x, z, color, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.add(mesh(cyl(0.02 * s, 0.025 * s, 0.3 * s, 6), stemMat, 0, 0.15 * s, 0));
  g.add(mesh(sph(0.05 * s, 10), mat(0xffd95e), 0, 0.32 * s, 0));
  const pm = mat(color);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const p = mesh(sph(0.055 * s, 10), pm, Math.cos(a) * 0.09 * s, 0.32 * s, Math.sin(a) * 0.09 * s);
    p.scale.set(1, 0.4, 0.55);
    p.rotation.y = -a;
    g.add(p);
  }
  parent.add(g);
  return g;
}

function makeDuck(sc, bodyCol) {
  const dg = new THREE.Group();
  const dm = mat(bodyCol);
  const db = mesh(sph(0.11, 14), dm, 0, 0.02, 0);
  db.scale.set(1, 0.82, 1.35);
  dg.add(db);
  dg.userData.bodyRef = db;
  const dtail = mesh(new THREE.ConeGeometry(0.05, 0.1, 8), dm, 0, 0.06, -0.17);
  dtail.rotation.x = Math.PI / 2 - 0.6;
  dg.add(dtail);
  dg.add(mesh(sph(0.055, 12), dm, 0, 0.14, 0.1));
  const dbeak = mesh(new THREE.ConeGeometry(0.02, 0.06, 8), mat(0xef8f2f), 0, 0.135, 0.155);
  dbeak.rotation.x = Math.PI / 2;
  dg.add(dbeak);
  for (const side of [-1, 1]) {
    dg.add(mesh(sph(0.012, 8), mat(0x2b2b2b), side * 0.032, 0.165, 0.13));
    const wing = mesh(sph(0.05, 10), dm, side * 0.095, 0.03, -0.01);
    wing.scale.set(0.45, 0.7, 1.15);
    dg.add(wing);
  }
  dg.scale.setScalar(sc);
  return dg;
}

const bulbs = [];
const BULB_COLS = [0xff6b8a, 0x5ec8f8, 0xffd75e, 0x7ee787, 0xc792ff, 0xffa45e];
function stringLights(a, b, dip) {
  const pts = [];
  for (let i = 0; i <= 20; i++) {
    const t = i / 20;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    p.y -= Math.sin(t * Math.PI) * dip;
    pts.push(p);
  }
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x5c4a3a })
  ));
  for (let i = 2; i < 20; i += 3) {
    const col = BULB_COLS[bulbs.length % BULB_COLS.length];
    const bm = new THREE.MeshToonMaterial({ color: col, gradientMap: GRAD, emissive: col, emissiveIntensity: 0 });
    const bulb = mesh(sph(0.065, 10), bm, pts[i].x, pts[i].y - 0.05, pts[i].z);
    scene.add(bulb);
    const bg = new THREE.Sprite(new THREE.SpriteMaterial({
      map: smokeTex, color: col, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    bg.scale.setScalar(0.6);
    bg.position.copy(bulb.position);
    scene.add(bg);
    bulbs.push({ mat: bm, glow: bg, idx: bulbs.length, br: 0 });
  }
}

/* ---------- 随机散步状态机 ---------- */
// 障碍物（圆）：房子 / 池塘 / 大树 / 秋千 / 樱花树 / 长椅 / 野餐布 / 小猫 / 向日葵 / 菜地
const OBSTACLES = [
  [-6.2, -6.2, 3.4], [5, 4, 2.7], [5.6, -4.6, 0.7], [5.6, -2.9, 1.0],
  [-9.2, 6.4, 0.6], [10.2, 8.4, 0.5], [-4.6, 3.4, 1.4], [-6.4, 5.6, 1.4],
  [-3.5, 4.7, 0.6], [9.3, 5.8, 1.2], [9.2, -6.2, 1.8],
];
const WALK_BOUNDS = { minX: -10, maxX: 10, minZ: -8.5, maxZ: 9 };
const WALK_SPEED = 0.85;

const walk = { state: 'idle', target: new THREE.Vector2(2.2, 1.7), heading: 0.7, phase: 0, idleUntil: 1.2 };

// 点到线段的距离 < r 则视为路径会撞上障碍
function segHitsCircle(ax, az, bx, bz, cx, cz, r) {
  const abx = bx - ax, abz = bz - az;
  const len2 = abx * abx + abz * abz || 1e-6;
  let u = ((cx - ax) * abx + (cz - az) * abz) / len2;
  u = Math.max(0, Math.min(1, u));
  const dx = ax + abx * u - cx, dz = az + abz * u - cz;
  return dx * dx + dz * dz < r * r;
}
function pickTarget() {
  const px = girl.position.x, pz = girl.position.z;
  // 一半概率去固定活动点：池塘看鱼 / 坐长椅 / 荡秋千 / 回房休息
  walk.spot = null;
  if (Math.random() < 0.5) {
    const spot = SPOTS[(Math.random() * SPOTS.length) | 0];
    if (Math.hypot(spot.ax - px, spot.az - pz) > 1.2) {
      let ok = true;
      for (const [cx, cz, r] of OBSTACLES)
        if (segHitsCircle(px, pz, spot.ax, spot.az, cx, cz, r)) { ok = false; break; }
      if (ok) { walk.spot = spot; walk.target.set(spot.ax, spot.az); return; }
    }
  }
  for (let tries = 0; tries < 40; tries++) {
    const x = WALK_BOUNDS.minX + Math.random() * (WALK_BOUNDS.maxX - WALK_BOUNDS.minX);
    const z = WALK_BOUNDS.minZ + Math.random() * (WALK_BOUNDS.maxZ - WALK_BOUNDS.minZ);
    let ok = true;
    for (const [cx, cz, r] of OBSTACLES) {
      if (Math.hypot(x - cx, z - cz) < r + 0.35 || segHitsCircle(px, pz, x, z, cx, cz, r + 0.3)) {
        ok = false; break;
      }
    }
    if (ok && Math.hypot(x - px, z - pz) > 3) {   // 太近的点不值得走
      walk.target.set(x, z);
      return;
    }
  }
  walk.target.set(0, 6);   // 兜底：到院子中央附近
}
function lerpAngle(a, b, k) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * k;
}

/* ---------- 小女孩的固定活动点：池塘边看鱼 / 坐长椅 / 荡秋千 / 回房休息 ---------- */
const SPOTS = [
  { kind: 'bench', ax: -5.8, az: 4.3 },      // 长椅前空地（长椅朝向 -0.7 的正前方偏右）
  { kind: 'swing', ax: 6.65, az: -3.3 },     // 秋千支架旁
  { kind: 'pond',  ax: 5.0,  az: 7.2 },      // 池塘南沿
  { kind: 'house', ax: -8.06, az: -3.18 },   // 屋门口空地
];
const BENCH_SIT = { x: -4.6, y: 0.045, z: 3.4, rotY: -0.7 };        // 椅面上、朝椅背外
const SWING_SIT = { x: -0.52, y: -2.561, z: 0 };                    // 秋千踏板局部坐标（小熊旁边）
const DOOR_POS = { x: -7.35, z: -4.33 };                            // 屋门位置（世界坐标）
const DOOR_APPROACH = new THREE.Vector3(-8.06, 0, -3.18);           // 门口外的落点

// 到达活动点后进入对应状态
function startActivity(spot, t) {
  walk.fromPos = girl.position.clone();
  walk.fromRotY = girl.rotation.y;
  walk.approachPos = girl.position.clone();
  walk.approachRotY = girl.rotation.y;
  walk.blend = 0;
  if (spot.kind === 'bench') {
    walk.state = 'sit';
    walk.toPos = new THREE.Vector3(BENCH_SIT.x, BENCH_SIT.y, BENCH_SIT.z);
    walk.toRotY = BENCH_SIT.rotY;
    walk.actUntil = t + 9 + Math.random() * 8;
  } else if (spot.kind === 'swing') {
    walk.state = 'toSwing';
    walk.toPos = new THREE.Vector3(6.35, 0, -2.9);  // 秋千坐垫摆动路径旁站好
    walk.toRotY = Math.atan2(5.08 - walk.fromPos.x, -2.9 - walk.fromPos.z);
    walk.actUntil = t + 10 + Math.random() * 8;
    walk.hopT = -1;                                  // -1 = 还在等秋千荡回来
  } else if (spot.kind === 'pond') {
    walk.state = 'watch';
    walk.actUntil = t + 6 + Math.random() * 7;
    walk.heading = Math.atan2(5 - walk.fromPos.x, 4 - walk.fromPos.z);   // 面向池塘
  } else {   // house
    walk.state = 'enter';
    walk.toPos = new THREE.Vector3(DOOR_POS.x, 0, DOOR_POS.z);
    walk.toRotY = Math.atan2(DOOR_POS.x - walk.fromPos.x, DOOR_POS.z - walk.fromPos.z);
    walk.actUntil = t + 12 + Math.random() * 12;
  }
}
// 被点击等情况下中断活动，恢复到可活动的地面状态
function cancelActivity() {
  if (girl.parent !== diorama) diorama.attach(girl);
  girl.visible = true;
  if (walk.state === 'swing' || walk.state === 'toSwing') girl.position.set(4.2, 0, -2.2);
  else if (!girl.visible || walk.state === 'inside' || walk.state === 'enter' || walk.state === 'exit') girl.position.copy(DOOR_APPROACH);
  girl.position.y = 0;
  girl.rotation.x = 0; girl.rotation.z = 0;
  legL.rotation.z = legR.rotation.z = 0;
}

    for (const [ax, az, ar] of BUNNY_AVOID)

    if (ok) for (const pp of pathPts)

    if (ok) for (const [ax, az, ar] of BUNNY_AVOID)

    if (ok && Math.hypot(x - bx, z - bz) > 1.4) { bunnyState.tx = x; bunnyState.tz = z; return; }
  }
  bunnyState.tx = -8.6; bunnyState.tz = 7.4;

function tzParts(tz) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  }).formatToParts(new Date());
}
function cityHourFrac(tz) {
  const p = tzParts(tz);
  const n = t => +p.find(x => x.type === t).value;
  return n('hour') + n('minute') / 60 + n('second') / 3600;
}
function cityHM(tz) {
  const p = tzParts(tz);
  const s = t => p.find(x => x.type === t).value;
  return s('hour') + ':' + s('minute');
}

function envFromHour(h) {
  if (h >= 6 && h < 18) return 0;
  if (h >= 19 || h < 5) return 1;
  return h < 6 ? 1 - (h - 5) : h - 18;
}

function weatherKind(code) {
  const c = code | 0;
  if (c === 45 || c === 48) return 'fog';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || (c >= 95 && c <= 99)) return 'rain';
  if (c === 2 || c === 3) return 'cloudy';
  return 'clear';
}

const weatherGoal = { sun: 1, cloudGray: 0, fog: 0, wet: 0 };

function applyWeatherKind(kind, cloudCover) {
  const cc = cloudCover == null ? (kind === 'clear' ? 15 : 70) : cloudCover;
  weather.kind = kind;
  if (kind === 'clear') Object.assign(weatherGoal, { sun: 1.12, cloudGray: 0.05, fog: 0, wet: 0 });
  else if (kind === 'cloudy') Object.assign(weatherGoal, { sun: 0.62, cloudGray: 0.55, fog: 0, wet: 0 });
  else if (kind === 'rain') Object.assign(weatherGoal, { sun: 0.48, cloudGray: 0.7, fog: 0.08, wet: 1 });
  else if (kind === 'snow') Object.assign(weatherGoal, { sun: 0.7, cloudGray: 0.45, fog: 0.12, wet: 0.15 });
  else if (kind === 'fog') Object.assign(weatherGoal, { sun: 0.4, cloudGray: 0.35, fog: 1, wet: 0.2 });
  rainLines.visible = kind === 'rain';
  rainPoints.visible = kind === 'rain';
  snowPoints.visible = kind === 'snow';
  for (const g of stormClouds) g.visible = (kind === 'rain' || kind === 'cloudy' || kind === 'snow');
  void cc;
  // 时钟栏天气文字
  const wxEl = document.getElementById('clockWx');
  if (wxEl) wxEl.textContent = ' ' + (WX_NAMES[kind] || '');
  // 雨停了 → 待会儿出现彩虹（夜间则等天亮再说）
  if (prevWxKind === 'rain' && kind !== 'rain') rainbowPending = true;
  prevWxKind = kind;
}

async function fetchWeather(city) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=weather_code,temperature_2m,is_day,precipitation,cloud_cover,wind_speed_10m&timezone=auto`;
    const r = await fetch(url);
    if (!r.ok) return;
    const j = await r.json();
    const cur = j.current || {};
    weather.temp = cur.temperature_2m;
    weather.code = cur.weather_code;
    weather.cloud = cur.cloud_cover;
    applyWeatherKind(weatherKind(cur.weather_code), cur.cloud_cover);
    const el = document.getElementById('clockTemp');
    if (el && weather.temp != null) el.textContent = Math.round(weather.temp) + '°';
  } catch (e) {
    /* silent degrade */
  }
}

const clock = new THREE.Clock();
const smokeBase = new THREE.Vector3(-6.2 + 1.5, 3.95, -6.2 - 0.5);

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* --- 白天/夜晚过渡 --- */
  if (timeAuto) {
    envTarget = envFromHour(cityHourFrac(currentCity.tz));
    syncDayButton();
  }
  clockTime.textContent = currentCity.name + ' ' + cityHM(currentCity.tz);
  env += (envTarget - env) * Math.min(1, delta * 1.6);
  const e = env;
  skyMat.uniforms.topColor.value.copy(DAY.skyTop).lerp(NIGHT.skyTop, e);
  skyMat.uniforms.bottomColor.value.copy(DAY.skyBottom).lerp(NIGHT.skyBottom, e);
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, e);
  hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, e);
  hemi.intensity = THREE.MathUtils.lerp(DAY.hemiInt, NIGHT.hemiInt, e);
  sun.color.copy(DAY.sunCol).lerp(NIGHT.sunCol, e);
  sun.intensity = THREE.MathUtils.lerp(DAY.sunInt, NIGHT.sunInt, e);
  sun.position.copy(DAY.sunPos).lerp(NIGHT.sunPos, e);
  ambient.color.copy(DAY.ambCol).lerp(NIGHT.ambCol, e);
  ambient.intensity = THREE.MathUtils.lerp(DAY.ambInt, NIGHT.ambInt, e);
  sunDisc.material.opacity = 1 - e;
  moon.material.opacity = e;
  starMat.opacity = e;
  glassMat.emissiveIntensity = 0.05 + e * 1.9;
  for (const lm of lanternMats) lm.emissiveIntensity = e * 1.6;
  for (const pl of lanternLights) pl.intensity = e * 1.5;
  for (const bb of bulbs) {
    const chase = Math.pow(Math.max(Math.sin((t * 0.7 - bb.idx / bulbs.length) * Math.PI * 2), 0), 5);
    bb.br = chase;
    bb.mat.emissiveIntensity = e * (0.3 + chase * 2.4);
  }
  fireflyMat.opacity = e;

  weatherMul.sun += (weatherGoal.sun - weatherMul.sun) * Math.min(1, delta * 1.2);
  weatherMul.cloudGray += (weatherGoal.cloudGray - weatherMul.cloudGray) * Math.min(1, delta * 1.2);
  weatherMul.fog += (weatherGoal.fog - weatherMul.fog) * Math.min(1, delta * 0.8);
  weatherMul.wet += (weatherGoal.wet - weatherMul.wet) * Math.min(1, delta * 0.6);
  sun.intensity *= weatherMul.sun;

  // 雨后彩虹：雨刚停时先记着，天亮(或已白天)就浮现 22 秒再缓缓消隐
  if (rainbowPending && env < 0.55) {
    rainbowUntil = t + 22;
    rainbowPending = false;
  }
  {
    const want = t < rainbowUntil ? 1 : 0;
    rainbowFade += (want - rainbowFade) * Math.min(1, delta * 0.5);
    const rop = rainbowFade * 0.38 * (1 - env);
    rainbow.visible = rop > 0.012;
    if (rainbow.visible) {
      for (const arc of rainbow.children) arc.material.opacity = rop;
      rainbow.rotation.z = Math.sin(t * 0.11) * 0.02;   // 极轻微的摇曳
    }
  }

  /* --- 小女孩：随机散步 --- */
  const holdUmb = umbrellaOpen > 0.05;   // 撑伞期间右臂姿态交给雨伞逻辑，状态机不再覆写
  const excited = t < excitedUntil;
  if (excited) {
    // 被点中：原地蹦跳 + 挥手
    girl.position.y = Math.abs(Math.sin(t * 9)) * 0.16;
    girl.scale.y = 1.1;
    head.rotation.z = Math.sin(t * 1.3) * 0.05;
    head.rotation.y = Math.sin(t * 6) * 0.1;
    armL.rotation.z = -0.28;
    if (!holdUmb) armR.rotation.z = 2.35 + Math.sin(t * 11) * 0.45;   // 右臂高举向外挥手
    armL.rotation.x = 0;
    if (!holdUmb) armR.rotation.x = 0;
    legL.rotation.x = legR.rotation.x = 0;
    tails[0].rotation.z = 0.16 + Math.sin(t * 4) * 0.2;
    tails[1].rotation.z = -0.16 - Math.sin(t * 4 + 0.5) * 0.2;
    tails[0].rotation.x = tails[1].rotation.x = 0;
  } else if (walk.state === 'walk') {
    // 走向目标点
    const dx = walk.target.x - girl.position.x;
    const dz = walk.target.y - girl.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.25) {
      if (walk.spot) { startActivity(walk.spot, t); }   // 到达活动点：坐下 / 上秋千 / 看鱼 / 进屋
      else {
        walk.state = 'idle';
        walk.idleUntil = t + 1.5 + Math.random() * 3;
        girl.position.y = 0;
      }
    } else {
      const step = Math.min(WALK_SPEED * delta, dist);
      girl.position.x += (dx / dist) * step;
      girl.position.z += (dz / dist) * step;
      // 平滑转向前进方向（模型正面朝 +z）
      walk.heading = lerpAngle(walk.heading, Math.atan2(dx, dz), Math.min(1, delta * 8));
      girl.rotation.y = walk.heading;
      // 步伐循环
      walk.phase += delta * 7.2;
      const sw = Math.sin(walk.phase);
      legL.rotation.x = sw * 0.55;
      legR.rotation.x = -sw * 0.55;
      armL.rotation.x = -sw * 0.35;
      if (!holdUmb) armR.rotation.x = sw * 0.35;
      armL.rotation.z = -0.3;
      if (!holdUmb) armR.rotation.z = 0.3;
      girl.position.y = Math.abs(Math.sin(walk.phase)) * 0.035;
      girl.scale.y = 1.1;
      head.rotation.z = Math.sin(walk.phase * 0.5) * 0.04;
      head.rotation.y = Math.sin(t * 0.6) * 0.1;
      head.rotation.x = 0.04;
      tails[0].rotation.z = 0.16 + Math.sin(walk.phase) * 0.18;
      tails[1].rotation.z = -0.16 - Math.sin(walk.phase + 0.5) * 0.18;
      tails[0].rotation.x = tails[1].rotation.x = Math.sin(walk.phase) * 0.15;
      dress.rotation.y = Math.sin(walk.phase * 0.5) * 0.04;
    }
  } else if (walk.state === 'sit' || walk.state === 'rise') {
    // 长椅：坐下/起身（0→1 混合出落座的过渡，带一点扑坐的小弧线）
    walk.blend = Math.min(1, walk.blend + delta * 1.8);
    const b = walk.blend * walk.blend * (3 - 2 * walk.blend);
    const k = walk.state === 'sit' ? b : 1 - b;
    girl.position.lerpVectors(walk.fromPos, walk.toPos, b);
    girl.position.y += Math.sin(b * Math.PI) * 0.22;
    girl.rotation.y = lerpAngle(walk.fromRotY, walk.toRotY, b);
    legL.rotation.x = legR.rotation.x = -1.4 * k;         // 腿向前伸
    legL.rotation.z = 0.06 * k; legR.rotation.z = -0.06 * k;
    armL.rotation.x = -0.55 * k;                          // 手搭在腿上
    armL.rotation.z = -0.28;
    if (!holdUmb) { armR.rotation.x = -0.55 * k; armR.rotation.z = 0.32; }
    head.rotation.z = Math.sin(t * 1.3) * 0.04;
    head.rotation.y = Math.sin(t * 0.5) * 0.18;
    head.rotation.x = 0.03 * k;
    tails[0].rotation.z = 0.16 + Math.sin(t * 1.8) * 0.1;
    tails[1].rotation.z = -0.16 - Math.sin(t * 1.8 + 0.5) * 0.1;
    tails[0].rotation.x = tails[1].rotation.x = 0;
    if (walk.blend >= 1) {
      if (walk.state === 'sit' && t > walk.actUntil) {
        walk.state = 'rise';                              // 该起来了
        [walk.fromPos, walk.toPos] = [walk.toPos.clone(), walk.approachPos.clone()];
        [walk.fromRotY, walk.toRotY] = [walk.toRotY, walk.approachRotY];
      } else if (walk.state === 'rise') {
        walk.state = 'idle';
        girl.position.y = 0;
        legL.rotation.z = legR.rotation.z = 0;
        walk.idleUntil = t + 0.8;
        walk.spot = null;
      }
    }
  } else if (walk.state === 'toSwing') {
    // 走到秋千旁站好，等坐垫荡回最低点时起跳，和小熊并排坐
    if (walk.hopT < 0) {
      walk.blend = Math.min(1, walk.blend + delta * 1.6);
      const b = walk.blend * walk.blend * (3 - 2 * walk.blend);
      girl.position.lerpVectors(walk.fromPos, walk.toPos, b);
      girl.rotation.y = lerpAngle(walk.fromRotY, walk.toRotY, b);
      legL.rotation.x = legR.rotation.x = 0;
      armL.rotation.x = 0;
      if (!holdUmb) armR.rotation.x = 0;
      if (walk.blend >= 1 && Math.abs(swingPivot.rotation.x) < 0.06) walk.hopT = 0;
    } else {
      walk.hopT = Math.min(1, walk.hopT + delta * 2.6);
      const ht = walk.hopT;
      const seatW = swingSeat.localToWorld(new THREE.Vector3(SWING_SIT.x, SWING_SIT.y, SWING_SIT.z));
      girl.position.lerpVectors(walk.toPos, seatW, ht);
      girl.position.y += Math.sin(ht * Math.PI) * 0.35;   // 抛物线小跳
      girl.rotation.y = lerpAngle(walk.toRotY, 0, ht);
      legL.rotation.x = legR.rotation.x = -0.5;           // 空中屈膝准备落座
      if (ht >= 1) {
        swingSeat.add(girl);
        girl.position.set(SWING_SIT.x, SWING_SIT.y, SWING_SIT.z);
        girl.rotation.set(0, 0, 0);
        walk.state = 'swing';
      }
    }
  } else if (walk.state === 'swing') {
    // 荡秋千：腿前伸、双手抓绳，马尾随摆幅飘
    const swA = swingPivot.rotation.x;
    legL.rotation.x = legR.rotation.x = -1.35;
    legL.rotation.z = 0.05; legR.rotation.z = -0.05;
    armL.rotation.x = -2.2; armL.rotation.z = -0.45;
    if (!holdUmb) { armR.rotation.x = -2.2; armR.rotation.z = 0.45; }
    head.rotation.z = Math.sin(t * 1.3) * 0.04;
    head.rotation.y = 0;
    tails[0].rotation.x = tails[1].rotation.x = 0.3 + swA * 1.3;
    tails[0].rotation.z = 0.16; tails[1].rotation.z = -0.16;
    girl.position.y = SWING_SIT.y + Math.abs(Math.sin(t * 2.2)) * 0.008;
    if (t > walk.actUntil && Math.abs(swingPivot.rotation.x) < 0.05) {
      diorama.attach(girl);                               // 荡回低点时跳下来
      walk.hopFrom = girl.position.clone();
      walk.hopFromY = walk.hopFrom.y;
      walk.toPos = new THREE.Vector3(6.35, 0, -2.9);
      walk.hopT = 0;
      girl.rotation.x = 0; girl.rotation.z = 0;
      walk.state = 'hopOff';
    }
  } else if (walk.state === 'hopOff') {
    // 从秋千跳落到草地的小弧线
    walk.hopT = Math.min(1, walk.hopT + delta * 2.6);
    const ht = walk.hopT;
    girl.position.lerpVectors(walk.hopFrom, walk.toPos, ht);
    girl.position.y = THREE.MathUtils.lerp(walk.hopFromY, 0, ht) + Math.sin(ht * Math.PI) * 0.3;
    legL.rotation.x = legR.rotation.x = -0.4 * Math.sin(ht * Math.PI);
    if (ht >= 1) {
      girl.position.y = 0;
      legL.rotation.x = legR.rotation.x = 0;
      legL.rotation.z = legR.rotation.z = 0;
      walk.state = 'idle';
      walk.idleUntil = t + 1;
      walk.spot = null;
    }
  } else if (walk.state === 'watch') {
    // 池塘边看鱼：背着手看小鸭和锦鲤，偶尔歪头
    girl.rotation.y = lerpAngle(girl.rotation.y, walk.heading, Math.min(1, delta * 5));
    girl.position.y = Math.abs(Math.sin(t * 2)) * 0.012;
    girl.scale.y = 1.1;
    armL.rotation.x = 0.35; armL.rotation.z = -0.18;
    if (!holdUmb) { armR.rotation.x = 0.35; armR.rotation.z = 0.18; }
    head.rotation.z = Math.sin(t * 0.9) * 0.06;
    head.rotation.y = Math.sin(t * 0.4) * 0.12;
    head.rotation.x = 0.06;
    tails[0].rotation.z = 0.16 + Math.sin(t * 1.6) * 0.08;
    tails[1].rotation.z = -0.16 - Math.sin(t * 1.6 + 0.5) * 0.08;
    tails[0].rotation.x = tails[1].rotation.x = 0;
    if (t > walk.actUntil) {
      walk.state = 'idle';
      girl.position.y = 0;
      walk.idleUntil = t + 1;
      walk.spot = null;
    }
  } else if (walk.state === 'enter' || walk.state === 'exit') {
    // 走进屋门 / 从屋里走出来
    walk.blend = Math.min(1, walk.blend + delta * 1.3);
    const b = walk.blend * walk.blend * (3 - 2 * walk.blend);
    girl.position.lerpVectors(walk.fromPos, walk.toPos, b);
    girl.rotation.y = lerpAngle(walk.fromRotY, walk.toRotY, b);
    const step = Math.sin(t * 9) * 0.4;
    legL.rotation.x = step; legR.rotation.x = -step;
    armL.rotation.x = -step * 0.6;
    if (!holdUmb) armR.rotation.x = step * 0.6;
    if (walk.blend >= 1) {
      if (walk.state === 'enter') {
        girl.visible = false;                             // 进屋休息
        walk.state = 'inside';
      } else {
        walk.state = 'idle';
        walk.idleUntil = t + 1;
        walk.spot = null;
      }
    }
  } else if (walk.state === 'inside') {
    // 在屋里休息（看不见），时间到了出门
    if (t > walk.actUntil) {
      girl.visible = true;
      walk.state = 'exit';
      [walk.fromPos, walk.toPos] = [walk.toPos.clone(), walk.approachPos.clone()];
      walk.toRotY = Math.atan2(walk.approachPos.x - walk.fromPos.x, walk.approachPos.z - walk.fromPos.z);
      walk.fromRotY = walk.toRotY + Math.PI;
    }
  } else {
    // 原地休息：呼吸、左顾右盼
    girl.position.y = Math.abs(Math.sin(t * 2.2)) * 0.018;
    girl.scale.y = 1.1 * (1 + Math.sin(t * 2) * 0.008);
    head.rotation.z = Math.sin(t * 1.3) * 0.05;
    head.rotation.y = Math.sin(t * 0.6) * 0.14;
    head.rotation.x = 0;
    armL.rotation.z = -0.28 - Math.sin(t * 2) * 0.07;
    if (!holdUmb) armR.rotation.z = 0.32 + Math.sin(t * 2 + 1) * 0.07;
    armL.rotation.x = 0;
    if (!holdUmb) armR.rotation.x = 0;
    legL.rotation.x = legR.rotation.x = 0;
    tails[0].rotation.z = 0.16 + Math.sin(t * 2.6) * 0.13;
    tails[1].rotation.z = -0.16 - Math.sin(t * 2.6 + 0.5) * 0.13;
    tails[0].rotation.x = tails[1].rotation.x = Math.sin(t * 1.8) * 0.08;
    dress.rotation.y = Math.sin(t * 2.2) * 0.03;
    if (t > walk.idleUntil) {
      pickTarget();
      walk.state = 'walk';
    }
  }

  // 雨天撑伞：右臂缓缓举到头顶，伞面随之撑开；雨停后收起
  umbrellaOpen += ((weather.kind === 'rain' ? 1 : 0) - umbrellaOpen) * Math.min(1, delta * 3.2);
  umbrella.visible = umbrellaOpen > 0.04;
  umbrella.scale.setScalar(Math.max(0.001, umbrellaOpen));
  if (umbrellaOpen > 0.05) {
    const uk = Math.min(1, delta * 6) * umbrellaOpen;
    armR.rotation.x += (-2.3 - armR.rotation.x) * uk;   // 举臂过头顶偏前（−x 旋转让手向 +z 上方抬）
    armR.rotation.z += (0.15 - armR.rotation.z) * uk;
  }

  /* --- 小猫 / 秋千 / 树 / 晾衣 / 涟漪 --- */
  if (t < catExcitedUntil) {
    cat.position.y = Math.abs(Math.sin(t * 10)) * 0.14;    // 被点中：蹦跳 + 尾巴快摇
    cat.userData.tail.rotation.y = Math.sin(t * 14) * 0.6;
    catHead.rotation.y = Math.sin(t * 3) * 0.5;
  } else {
    cat.position.y = 0;
    cat.userData.tail.rotation.y = Math.sin(t * 2.6) * 0.35;
    catHead.rotation.y = Math.sin(t * 0.5) * 0.35;
  }
  swingPivot.rotation.x = Math.sin(t * 0.85) * 0.22;
  // 屋门：小女孩进出屋时缓缓敞开
  const doorWant = (walk.state === 'enter' || walk.state === 'inside' || walk.state === 'exit') ? -1.15 : 0;
  doorG.rotation.y += (doorWant - doorG.rotation.y) * Math.min(1, delta * 3.5);
  for (const tr of trees) {
    tr.userData.foliage.rotation.z = Math.sin(t * 0.9 + tr.userData.phase) * 0.028;
    tr.userData.foliage.rotation.x = Math.sin(t * 0.7 + tr.userData.phase * 2) * 0.02;
  }
  for (const c of laundry) {
    c.rotation.y = Math.sin(t * 2.2 + c.userData.phase) * 0.35;
    c.rotation.z = Math.sin(t * 1.7 + c.userData.phase) * 0.1;
  }
  for (const r of ripples) {
    const life = (t * 0.35 + r.userData.phase) % 1;
    r.scale.setScalar(0.4 + life * 1.9);
    r.material.opacity = (1 - life) * 0.35;
  }

  /* --- 气球 / 悬浮小岛 / 炊烟 --- */
  balloon.position.y = 2.6 + Math.sin(t * 1.3) * 0.12;
  balloon.rotation.z = Math.sin(t * 0.8) * 0.08;
  for (const isl of floatingIslands) {
    isl.position.y = isl.userData.baseY + Math.sin(t * 0.5 + isl.userData.phase) * 0.18;
    isl.rotation.y = Math.sin(t * 0.3 + isl.userData.phase) * 0.02;
  }
  for (const sp of smoke) {
    const life = (t * 0.22 + sp.userData.phase) % 1;
    sp.position.set(
      smokeBase.x + Math.sin(life * 6 + sp.userData.phase * 8) * 0.25,
      smokeBase.y + life * 2.4,
      smokeBase.z
    );
    sp.scale.setScalar(0.35 + life * 1.1);
    sp.material.opacity = Math.sin(life * Math.PI) * 0.4;
  }

  /* --- 蝴蝶 / 小鸟 / 白云 --- */
  for (const b of butterflies) {
    const u = b.userData;
    const a = t * u.speed + u.phase;
    b.position.set(
      u.cx + Math.cos(a) * u.r,
      u.h + Math.sin(a * 2.3) * 0.25,
      u.cz + Math.sin(a) * u.r * 0.7
    );
    b.rotation.y = Math.atan2(-Math.sin(a), 0.7 * Math.cos(a));   // 椭圆航线速度方向
    const flap = Math.sin(t * u.flap + u.phase) * 0.95;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  }
  for (const bd of birds) {
    const u = bd.userData;
    const a = t * u.speed + u.phase;
    bd.position.set(Math.cos(a) * u.r, u.h + Math.sin(a * 3) * 0.6, Math.sin(a) * u.r);
    bd.rotation.y = -a;
    const flap = Math.sin(t * 7 + u.phase) * 0.7;
    u.wl.rotation.z = flap;
    u.wr.rotation.z = -flap;
  }
  for (const cl of clouds) {
    cl.position.x += cl.userData.speed * delta;
    cl.position.y += Math.sin(t * 0.4 + cl.userData.phase) * 0.002;
    if (cl.position.x > 42) cl.position.x = -42;
  }

  /* --- 萤火虫 --- */
  {
    const pos = fireflyGeo.attributes.position;
    const col = fireflyGeo.attributes.color;
    for (let i = 0; i < fireflyCount; i++) {
      pos.array[i * 3] = fireflyBase[i * 3] + Math.sin(t * 0.7 + i * 1.7) * 0.6;
      pos.array[i * 3 + 1] = fireflyBase[i * 3 + 1] + Math.sin(t * 1.1 + i * 2.3) * 0.35;
      pos.array[i * 3 + 2] = fireflyBase[i * 3 + 2] + Math.cos(t * 0.5 + i * 0.9) * 0.6;
      // 各自独立的亮灭脉冲：快亮慢熄，留一点余烬微光
      const p = (t * fireflyBlink[i].spd + fireflyBlink[i].ph) % 1;
      const br = Math.pow(Math.max(Math.sin(p * Math.PI * 2), 0), 6) * 0.95 + 0.05;
      col.array[i * 3] = col.array[i * 3 + 1] = col.array[i * 3 + 2] = br;
    }
    pos.needsUpdate = true;
    col.needsUpdate = true;
  }

  /* ========== 增补元素动画 ========== */
  fillLight.intensity = THREE.MathUtils.lerp(0.35, 0.1, env) * (0.65 + 0.35 * weatherMul.sun);
  cloudMat.color.setRGB(
    1 - weatherMul.cloudGray * 0.35,
    1 - weatherMul.cloudGray * 0.32,
    1 - weatherMul.cloudGray * 0.28
  );
  stormCloudMat.color.setRGB(
    0.77 - weatherMul.cloudGray * 0.22,
    0.81 - weatherMul.cloudGray * 0.20,
    0.84 - weatherMul.cloudGray * 0.18
  );
  grassMat.color.setHex(0x8ec963).lerp(new THREE.Color(0x5a8a48), weatherMul.wet * 0.55);
  innerGround.material.color.copy(innerBase).lerp(innerWet, weatherMul.wet);
  dirtMat.color.copy(dirtBase).lerp(dirtWet, weatherMul.wet);
  scene.fog.density = 0.00001 + weatherMul.fog * 0.018;
  scene.fog.color.copy(skyMat.uniforms.bottomColor.value);
  renderer.setClearColor(skyMat.uniforms.bottomColor.value, 1);
  fogHaze.material.color.copy(skyMat.uniforms.bottomColor.value);
  fogHaze.material.opacity = weatherMul.fog * 0.22;
  fogHaze.visible = weatherMul.fog > 0.04;

  if (rainLines.visible) {
    const arr = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_N; i++) {
      const dy = rainSpd[i] * delta;
      arr[i * 6 + 1] -= dy;
      arr[i * 6 + 4] -= dy;
      arr[i * 6] += 1.6 * delta;
      arr[i * 6 + 3] += 1.6 * delta;
      if (arr[i * 6 + 4] < 0) {
        const x = (Math.random() - 0.5) * 46;
        const y = 16 + Math.random() * 10;
        const z = (Math.random() - 0.5) * 40;
        const len = rainLen[i];
        arr[i * 6]     = x;
        arr[i * 6 + 1] = y;
        arr[i * 6 + 2] = z;
        arr[i * 6 + 3] = x + 0.12;
        arr[i * 6 + 4] = y - len;
        arr[i * 6 + 5] = z;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  if (snowPoints.visible) {
    const arr = snowPoints.geometry.attributes.position.array;
    const spd = snowPoints.userData.spd;
    for (let i = 0; i < spd.length; i++) {
      arr[i*3 + 1] -= (1.6 + spd[i] * 1.2) * delta;
      arr[i*3] += Math.sin(t * 0.8 + i) * 0.4 * delta;
      if (arr[i*3 + 1] < 0) {
        arr[i*3 + 1] = 16 + Math.random() * 10;
        arr[i*3] = (Math.random() - 0.5) * 48;
        arr[i*3 + 2] = (Math.random() - 0.5) * 42;
      }
    }
    snowPoints.geometry.attributes.position.needsUpdate = true;
  }

  // 夜晚光晕呼吸
  for (const bb of bulbs) bb.glow.material.opacity = e * (0.05 + bb.br * 0.62);
  for (const gsp of lanternGlows) gsp.material.opacity = e * (0.62 + Math.abs(Math.sin(t * 9)) * 0.12);
  for (const gsp of windowGlows) gsp.material.opacity = e * 0.33;

  // 微波水面
  {
    const wpa = waveGeo.attributes.position;
    for (let vi = 0; vi < wpa.count; vi++)
      wpa.array[vi * 3 + 1] = Math.sin(t * 2.3 + waveBase[vi * 3] * 2.4 + waveBase[vi * 3 + 2] * 3.1) * 0.018;
    wpa.needsUpdate = true;
  }

  // 风车迎风转动
  for (let i = 0; i < pinwheels.length; i++)
    pinwheels[i].rotation.z -= delta * (2.6 + Math.sin(t * 0.7 + i * 2.2) * 1.1);

  // 向日葵：白天花盘追随太阳方向，入夜缓缓垂头
  for (const h of sunflowerHeads) {
    h.getWorldPosition(SF_TMP);
    SF_TMP.copy(sun.position).sub(SF_TMP).normalize();
    SF_TMP.lerp(h.userData.droop, e * e).normalize();   // 平方缓入，垂头只在深夜明显
    h.quaternion.setFromUnitVectors(SF_UP, SF_TMP);
    h.rotateZ(Math.sin(t * 0.6 + h.userData.ph) * 0.035);
  }

  // 樱花瓣飘落
  for (const p of petals) {
    if (!p.on) {
      if (t > p.next) {
        p.on = true;
        p.m.visible = true;
        const em = EMITTERS[(Math.random() * EMITTERS.length) | 0];
        p.m.position.set(
          em.x + (Math.random() - 0.5) * 1.9,
          em.y + Math.random() * 0.4,
          em.z + (Math.random() - 0.5) * 1.9
        );
        p.vx = 0.12 + Math.random() * 0.25;
        p.vz = (Math.random() - 0.5) * 0.22;
        p.rx = (Math.random() - 0.5) * 7;
        p.rz = (Math.random() - 0.5) * 7;
      }
      continue;
    }
    p.m.position.x += p.vx * delta;
    p.m.position.z += p.vz * delta;
    p.m.position.y -= (0.48 + Math.sin(t * 3 + p.vx * 9) * 0.14) * delta;
    p.m.rotation.x += p.rx * delta;
    p.m.rotation.z += p.rz * delta;
    if (p.m.position.y < 0.04) {
      p.on = false;
      p.m.visible = false;
      p.next = t + 0.3 + Math.random() * 1.8;
    }
  }

  // 锦鲤巡游
  for (const k of kois) {
    const ka = t * k.spd + k.phase;
    k.g.position.set(Math.cos(ka) * k.r, 0.05, Math.sin(ka) * k.r * k.squash);
    k.g.rotation.y = Math.atan2(-Math.sin(ka), Math.cos(ka) * k.squash);
    k.tail.rotation.z = Math.sin(t * 9 + k.phase * 3) * 0.35;
  }
  // 青蛙鼓腮呼吸
  frogThroat.scale.setScalar(1 + Math.max(0, Math.sin(t * 2.6)) * 0.6);
  frogBody.scale.y = 0.8 + Math.sin(t * 2.6) * 0.02;

  // 鸭子排队游
  for (const d of duckTrain) {
    const da = t * 0.4 - d.off;
    d.g.position.set(
      Math.cos(da) * 1.5,
      (d.g.scale.x > 1 ? 0.19 : 0.175) + Math.sin(t * 8 + d.wob) * 0.006,
      Math.sin(da) * 1.05
    );
    d.g.rotation.y = Math.atan2(-Math.sin(da) * 1.5, Math.cos(da) * 1.05);
    d.g.rotation.z = Math.sin(t * 7 + d.wob) * 0.05;   // 划水摇摆
  }

  // 小蜜蜂绕花采蜜
  for (const b of bees) {
    const u = b.userData, ba = t * u.sp + u.ph;
    b.position.set(u.c.x + Math.cos(ba) * u.r, u.h + Math.sin(ba * 3.1) * 0.12, u.c.y + Math.sin(ba) * u.r * 0.85);
    b.rotation.y = -ba + Math.PI / 2;
    const bf = Math.sin(t * 42 + u.ph) * 0.85;
    u.wl.rotation.z = bf; u.wr.rotation.z = -bf;
  }

  // 小兔子蹦跶
  if (bunnyState.mode === 'celebrate') {
    const bounce = Math.abs(Math.sin(t * 10));   // 被点中：原地欢快蹦跳 + 耳朵竖起
    bunny.position.y = bounce * 0.2;
    bunnyBody.scale.y = 0.95 * (0.94 + bounce * 0.12);
    bunny.userData.ears.forEach(e => { e.rotation.x = -0.55 * bounce; });
    bunnyHead.rotation.y = Math.sin(t * 4) * 0.3;
    if (t > bunnyState.until) {
      bunnyState.mode = 'rest';
      bunnyState.idleUntil = t + 2;
      bunny.position.y = 0;
    }
  } else if (bunnyState.mode === 'rest') {
    bunny.position.y = 0;
    bunnyBody.scale.y = 0.95 * (1 + Math.sin(t * 3) * 0.02);   // 呼吸
    const twitch = Math.sin(t * 1.9) > 0.986 ? Math.sin(t * 55) * 0.3 : 0;   // 耳朵偶尔抖动
    bunny.userData.ears.forEach(e => { e.rotation.x = twitch; });
    bunnyHead.rotation.y = Math.sin(t * 0.8) * 0.25;
    if (t > bunnyState.idleUntil) {
      bunnyPick();
      bunnyState.mode = 'hop';
    }
  } else {
    const bdx = bunnyState.tx - bunny.position.x;
    const bdz = bunnyState.tz - bunny.position.z;
    const bdist = Math.hypot(bdx, bdz);
    if (bdist < 0.2) {
      bunnyState.mode = 'rest';
      bunnyState.idleUntil = t + 1.5 + Math.random() * 3.5;
      bunny.position.y = 0;
    } else {
      const bs = Math.min(delta * 1.05, bdist);
      bunny.position.x += (bdx / bdist) * bs;
      bunny.position.z += (bdz / bdist) * bs;
      bunny.rotation.y = lerpAngle(bunny.rotation.y, Math.atan2(bdx, bdz), Math.min(1, delta * 7));
      const bounce = Math.abs(Math.sin(t * 8.5));
      bunny.position.y = bounce * 0.17;
      bunnyBody.scale.y = 0.95 * (0.94 + bounce * 0.1);
      bunny.userData.ears.forEach(e => { e.rotation.x = -0.5 * bounce; });
      bunnyHead.rotation.y = 0;
    }
  }

  // 流星（只在夜晚出现）
  for (const m of meteors) {
    if (!m.active) {
      if (env > 0.65 && t > m.nextAt) {
        m.active = true;
        const ma = Math.random() * Math.PI * 2, me = 0.75 + Math.random() * 0.35, mr = 150;
        m.pos.set(Math.cos(ma) * Math.cos(me) * mr, Math.sin(me) * mr, Math.sin(ma) * Math.cos(me) * mr);
        m.vel.set(-Math.cos(ma) * 26 + (Math.random() - 0.5) * 14, -34, -Math.sin(ma) * 26 + (Math.random() - 0.5) * 14);
        m.hist = [];
        m.endAt = t + 1.5;
        m.head.scale.setScalar(2.6);
      }
      continue;
    }
    m.pos.addScaledVector(m.vel, delta);
    m.hist.unshift(m.pos.clone());
    if (m.hist.length > 20) m.hist.pop();
    const fade = Math.max(0, Math.min(1, (m.endAt - t) / 0.45)) * env;
    m.head.position.copy(m.pos);
    m.head.material.opacity = fade;
    m.trail.forEach((ts, k) => {
      const hp = m.hist[Math.min(k * 3 + 2, m.hist.length - 1)];
      if (hp) ts.position.copy(hp);
      ts.scale.setScalar(2.1 - k * 0.24);
      ts.material.opacity = fade * (1 - k / 8) * 0.8;
    });
    if (t > m.endAt + 0.5) {
      m.active = false;
      m.head.material.opacity = 0;
      m.trail.forEach(ts => ts.material.opacity = 0);
      m.nextAt = t + 7 + Math.random() * 9;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('loading').classList.add('hide');

// 调试探针：控制台可用 __yard() 查看内部状态；__yardStep(n) 手动推进 n 帧（页面在后台 rAF 暂停时用）
const __scr = v => { const p = v.clone().project(camera); return [Math.round((p.x * 0.5 + 0.5) * innerWidth), Math.round((-p.y * 0.5 + 0.5) * innerHeight)]; };
window.__yard = () => ({ env, envTarget, timeAuto, umbrellaOpen, wx: weather.kind, rainbowPending, rainbowFade, autoRotate: controls.autoRotate,
  state: walk.state, spot: walk.spot ? walk.spot.kind : null,
  armX: +armR.rotation.x.toFixed(2), armZ: +armR.rotation.z.toFixed(2),
  upos: umbrella.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)),
  gpos: girl.position.toArray().map(v => +v.toFixed(2)),
  girlScr: __scr(girl.position.clone().setY(0.8)), catScr: __scr(cat.position.clone().setY(0.3)), bunnyScr: __scr(bunny.position.clone().setY(0.15)),
  catY: +cat.position.y.toFixed(3), bunnyMode: bunnyState.mode, catExcited: clock.elapsedTime < catExcitedUntil });
window.__yardGoto = kind => {
  const s = SPOTS.find(sp => sp.kind === kind);
  if (!s) return false;
  cancelActivity();
  walk.spot = s;
  walk.state = 'walk';
  walk.target.set(s.ax, s.az);
  return true;
};
window.__pick = (x, y) => {
  pointer.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  return { cat: raycaster.intersectObject(cat, true).length, bunny: raycaster.intersectObject(bunny, true).length, girl: raycaster.intersectObjects(girlMeshes, false).length };
};
window.__yardHurry = () => { walk.actUntil = Math.min(walk.actUntil || Infinity, clock.elapsedTime + 0.3); };   // 调试：立刻结束当前活动
window.__yardTeleport = (x, z) => { cancelActivity(); girl.position.set(x, 0, z); walk.state = 'idle'; walk.idleUntil = 1e9; };   // 调试：原地站定
window.__yardStep = (n = 1) => { for (let i = 0; i < n; i++) animate(); };
animate();
</script>
