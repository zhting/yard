renderer.domElement.addEventListener('pointercancel', endTouchPointer);

/* ============================================================
   动画风后期管线
   场景 → HDR 离屏（MSAA + 深度纹理）
        → 风格合成：深度描线 + 雨天积水 / 池塘的屏幕空间倒影 + 雨滴涟漪
        → 泛光（只让灯、窗、月亮这类超亮像素发光）
        → 色调映射 + 日系调色（略提饱和、暗部偏冷、轻暗角）→ 屏幕
   WebGL1 设备没有可靠的半浮点 MSAA，直接退回原来的单遍渲染。
============================================================ */
post = (() => {
  if (!renderer.capabilities.isWebGL2) return null;

  const size = new THREE.Vector2();
  const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const fsGeo = new THREE.PlaneGeometry(2, 2);
  const fsQuad = (material) => {
    const s = new THREE.Scene();
    const m = new THREE.Mesh(fsGeo, material);
    m.frustumCulled = false;
    s.add(m);
    return s;
  };

  const makeTargets = () => {
    renderer.getDrawingBufferSize(size);
    const w = Math.max(1, size.x), h = Math.max(1, size.y);
    // 高分屏本身像素够密，MSAA 只在 1x~1.5x 像素比时开，省显存
    const samples = (quality === 'high' && renderer.getPixelRatio() <= 1.5) ? 4 : 0;
    const main = new THREE.WebGLRenderTarget(w, h, {
      type: THREE.HalfFloatType, samples,
      depthTexture: new THREE.DepthTexture(w, h, THREE.UnsignedIntType),
    });
    main.depthTexture.minFilter = main.depthTexture.magFilter = THREE.NearestFilter;
    const comp = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, depthBuffer: false });
    return { main, comp, w, h };
  };
  let rt = makeTargets();

  const styleMat = new THREE.ShaderMaterial({
    toneMapped: false, depthTest: false, depthWrite: false,
    uniforms: {
      tColor: { value: null }, tDepth: { value: null },
      uRes: { value: new THREE.Vector2(rt.w, rt.h) },
      uNear: { value: 0.1 }, uFar: { value: 500 },
      uProj: { value: new THREE.Matrix4() }, uProjInv: { value: new THREE.Matrix4() },
      uView: { value: new THREE.Matrix4() }, uCamWorld: { value: new THREE.Matrix4() },
      uLineW: { value: 1 }, uPixAng: { value: 0.002 }, uInk: { value: new THREE.Color(0.1, 0.11, 0.2) }, uLineAmt: { value: 0.9 },
      uWet: { value: 0 }, uPond: { value: 0.5 }, uRipple: { value: 0 }, uTime: { value: 0 },
      uSkyLo: { value: new THREE.Color() }, uSkyHi: { value: new THREE.Color() },
      uSteps: { value: 22 },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tColor, tDepth;
      uniform vec2 uRes;
      uniform float uNear, uFar, uLineW, uPixAng, uLineAmt, uWet, uPond, uRipple, uTime;
      uniform mat4 uProj, uProjInv, uView, uCamWorld;
      uniform vec3 uInk, uSkyLo, uSkyHi;
      uniform int uSteps;
      varying vec2 vUv;

      float viewZ(float d) {                       // 深度缓冲 → 视空间距离（正数）
        float z = d * 2.0 - 1.0;
        return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear));
      }
      float invZAt(vec2 uv) { return 1.0 / viewZ(texture2D(tDepth, uv).x); }
      vec3 viewPosAt(vec2 uv, float d) {
        vec4 p = uProjInv * vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
        return p.xyz / p.w;
      }
      vec2 projectUv(vec3 p) { vec4 c = uProj * vec4(p, 1.0); return c.xy / c.w * 0.5 + 0.5; }

      float hash12(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      float vnoise(vec2 p) {
        vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x),
                   mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
      }
      // 程序化雨滴涟漪：每个格子里一圈向外扩散、逐渐变淡的波纹
      // xy = 波纹法线扰动（世界 xz），z = 波峰亮度
      vec3 ripples(vec2 p) {
        vec3 acc = vec3(0.0);
        vec2 cell = floor(p);
        for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
          vec2 c = cell + vec2(float(i), float(j));
          float h = hash12(c);
          vec2 ctr = c + vec2(hash12(c + 17.1), hash12(c + 31.7));
          float ph = fract(uTime * (0.8 + h * 0.7) + h * 7.0);
          vec2 d = p - ctr;
          float r = length(d);
          float ring = exp(-pow((r - ph * 0.6) * 26.0, 2.0)) * (1.0 - ph) * (1.0 - ph);
          acc.xy += (r > 1e-4 ? d / r : vec2(0.0)) * ring;
          acc.z += ring;
        }
        return acc;
      }

      void main() {
        vec3 col = texture2D(tColor, vUv).rgb;
        float dC = texture2D(tDepth, vUv).x;
        float zC = viewZ(dC);
        float iC = 1.0 / zC;

        /* ---- 积水 / 池塘倒影（屏幕空间反射，只作用在朝上的地面）---- */
        if ((uWet > 0.001 || uPond > 0.001) && dC < 1.0) {
          vec3 vp = viewPosAt(vUv, dC);
          vec3 wp = (uCamWorld * vec4(vp, 1.0)).xyz;
          vec3 wn = normalize(cross(dFdx(wp), dFdy(wp)));
          if (wp.y > -0.03 && wp.y < 0.2 && abs(wn.y) > 0.9) {
            vec2 pp = wp.xz;
            float pond = (1.0 - smoothstep(0.9, 0.99, length((pp - vec2(5.0, 4.0)) / vec2(2.1, 1.512)))) * step(0.12, wp.y);
            vec2 q = max(abs(pp) - vec2(13.35, 11.35) + 3.05, 0.0);
            float yard = 1.0 - smoothstep(2.9, 3.05, length(q));       // 院子圆角矩形之内
            float n = vnoise(pp * 0.42) * 0.65 + vnoise(pp * 1.13 + 3.1) * 0.35;
            float puddle = smoothstep(0.46, 0.56, n);
            float wet = uWet * (0.2 + 0.8 * puddle) * yard * (1.0 - pond);
            float amt = wet + uPond * pond;
            if (amt > 0.003) {
              vec3 rip = uRipple > 0.001 ? ripples(pp * 2.4) * uRipple : vec3(0.0);
              vec3 nv = normalize((uView * vec4(rip.x * 0.4, 1.0, rip.y * 0.4, 0.0)).xyz);
              vec3 vdir = normalize(vp);
              vec3 rd = reflect(vdir, nv);
              vec3 rdW = (uCamWorld * vec4(rd, 0.0)).xyz;
              vec3 refl = mix(uSkyLo, uSkyHi, smoothstep(0.0, 0.85, rdW.y));
              float t = 0.12;
              vec3 prevP = vp;
              for (int i = 0; i < 24; i++) {
                if (i >= uSteps) break;
                vec3 P = vp + rd * t;
                if (P.z > -uNear) break;
                vec2 suv = projectUv(P);
                if (suv.x < 0.0 || suv.y < 0.0 || suv.x > 1.0 || suv.y > 1.0) break;
                float diff = -P.z - viewZ(texture2D(tDepth, suv).x);
                if (diff > 0.0 && diff < max(0.3, t * 0.4)) {
                  vec3 lo = prevP, hi = P;
                  for (int k = 0; k < 4; k++) {
                    vec3 m = (lo + hi) * 0.5;
                    if (-m.z > viewZ(texture2D(tDepth, projectUv(m)).x)) hi = m; else lo = m;
                  }
                  vec2 huv = projectUv(hi);
                  vec2 ef = smoothstep(0.0, 0.07, huv) * smoothstep(0.0, 0.07, 1.0 - huv);
                  refl = mix(refl, texture2D(tColor, huv).rgb, ef.x * ef.y);
                  break;
                }
                prevP = P;
                t = t * 1.26 + 0.05;
              }
              float fres = mix(0.3, 0.6, puddle) + 0.5 * pow(1.0 - clamp(dot(-vdir, nv), 0.0, 1.0), 3.0);
              float k = clamp(amt * fres, 0.0, 0.92);
              col = mix(col * (1.0 - 0.45 * wet), refl, k);
              col += rip.z * (0.3 + 0.7 * puddle) * yard * (uSkyHi * 0.5 + 0.08);
            }
          }
        }

        /* ---- 描线：在 1/z 上做拉普拉斯 ----
           透视下平面的 1/z 在屏幕上是线性的，所以平面处处为 0（斜着看的大草坪也不会糊出假线），
           只有轮廓（深度跳变）和凸棱（两侧斜率不同）会亮。除以「采样跨度对应的视角」
           之后，这个量就是两侧表面的斜率差（tan），与距离、分辨率都无关：
           棱角折过 ~30° 以上就上线，圆滑曲面不会。 */
        vec2 o = uLineW / uRes;
        float l = invZAt(vUv - vec2(o.x, 0.0)), r = invZAt(vUv + vec2(o.x, 0.0));
        float u = invZAt(vUv + vec2(0.0, o.y)), dn = invZAt(vUv - vec2(0.0, o.y));
        float a = invZAt(vUv + o), b = invZAt(vUv - o);
        float c = invZAt(vUv + vec2(o.x, -o.y)), d = invZAt(vUv + vec2(-o.x, o.y));
        float lap = max(max(2.0 * iC - l - r, 2.0 * iC - u - dn),
                        max(2.0 * iC - a - b, 2.0 * iC - c - d) * 0.7071) / (iC * uPixAng);
        float edge = smoothstep(0.45, 1.1, lap) * (1.0 - smoothstep(70.0, 160.0, zC));
        col = mix(col, col * uInk, edge * uLineAmt);

        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  styleMat.extensions.derivatives = true;
  const styleScene = fsQuad(styleMat);

  const finalMat = new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false,
    uniforms: {
      tColor: { value: null },
      uSat: { value: 1.12 }, uShadow: { value: new THREE.Color(0.78, 0.86, 1.08) }, uVig: { value: 0.22 },
      uNight: { value: 0 },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tColor;
      uniform float uSat, uVig, uNight;
      uniform vec3 uShadow;
      varying vec2 vUv;
      void main() {
        gl_FragColor = vec4(texture2D(tColor, vUv).rgb, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        vec3 g = gl_FragColor.rgb;
        float L = dot(g, vec3(0.2126, 0.7152, 0.0722));
        g = mix(vec3(L), g, uSat);                                    // 动画背景的通透饱和
        g = mix(g, g * uShadow, (1.0 - smoothstep(0.05, 0.6, L)) * 0.45); // 暗部偏冷蓝
        // 夜里除了灯光以外的一切都沉进靛蓝色（亮处保留暖色，所以按亮度加权）
        float lit = smoothstep(0.35, 0.8, L);
        vec3 navy = vec3(L) * vec3(0.62, 0.78, 1.45) + vec3(0.0, 0.01, 0.035);
        g = mix(g, mix(navy, g, 0.45), uNight * (1.0 - lit) * 0.75);
        vec2 v = vUv - 0.5;
        g *= 1.0 - uVig * smoothstep(0.25, 0.85, dot(v, v) * 2.2);
        gl_FragColor = vec4(clamp(g, 0.0, 1.0), 1.0);
      }`,
  });
  const finalScene = fsQuad(finalMat);

  const bloom = new UnrealBloomPass(new THREE.Vector2(rt.w, rt.h), 0.4, 0.55, 0.9);

  function resize() {
    rt.main.dispose(); rt.comp.dispose();
    rt = makeTargets();
    styleMat.uniforms.uRes.value.set(rt.w, rt.h);
    // 描线宽度跟着分辨率走：720p 约 1.6px，2K 以上封顶 3px
    styleMat.uniforms.uLineW.value = THREE.MathUtils.clamp(rt.h / 450, 1.2, 3);
    const bs = quality === 'low' ? 0.5 : 1;
    bloom.setSize(Math.round(rt.w * bs), Math.round(rt.h * bs));
  }
  resize();

  const _sky = new THREE.Color();
  function render(t) {
    const su = styleMat.uniforms;
    // 1) 场景 → HDR
    renderer.setRenderTarget(rt.main);
    renderer.render(scene, camera);

    // 2) 描线 + 倒影
    su.tColor.value = rt.main.texture;
    su.tDepth.value = rt.main.depthTexture;
    su.uNear.value = camera.near; su.uFar.value = camera.far;
    su.uPixAng.value = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / rt.h * su.uLineW.value;
    su.uProj.value.copy(camera.projectionMatrix);
    su.uProjInv.value.copy(camera.projectionMatrixInverse);
    su.uView.value.copy(camera.matrixWorldInverse);
    su.uCamWorld.value.copy(camera.matrixWorld);
    su.uTime.value = t;
    const outdoors = !interiorMode;
    su.uWet.value = outdoors ? weatherMul.wet : 0;
    su.uRipple.value = outdoors && weather.kind === 'rain' ? weatherMul.wet : 0;
    su.uPond.value = outdoors ? 0.55 : 0;
    su.uSteps.value = quality === 'low' ? 12 : 22;
    _sky.copy(skyMat.uniforms.bottomColor.value);
    su.uSkyLo.value.copy(_sky).multiplyScalar(0.8);
    su.uSkyHi.value.copy(skyMat.uniforms.topColor.value).lerp(_sky, 0.35);
    // 夜里墨线也是深靛蓝而不是纯黑
    su.uInk.value.setRGB(0.1, 0.11, 0.2).lerp(_sky.setRGB(0.2, 0.24, 0.44), env);
    renderer.setRenderTarget(rt.comp);
    renderer.render(styleScene, fsCam);

    // 3) 泛光：夜晚、雨天更强（灯和窗的光晕会糊开，像动画里的雨夜）
    bloom.strength = THREE.MathUtils.lerp(0.28, 0.95, env) + weatherMul.wet * 0.15;
    bloom.threshold = THREE.MathUtils.lerp(1.0, 0.75, env);
    bloom.render(renderer, null, rt.comp, 0, false);

    // 4) 色调映射 + 调色 → 屏幕
    finalMat.uniforms.tColor.value = rt.comp.texture;
    finalMat.uniforms.uSat.value = 1.12 + env * 0.06;
    finalMat.uniforms.uVig.value = 0.16 + env * 0.18;
    finalMat.uniforms.uNight.value = env * (interiorMode ? 0.3 : 1);   // 屋里开着灯，只染一点夜色
    renderer.setRenderTarget(null);
    renderer.render(finalScene, fsCam);
  }

  return { render, resize };
})();

function renderFrame(t = clock.elapsedTime) {
  if (post) post.render(t);
  else renderer.render(scene, camera);
}

/* ============================================================
   动画循环
============================================================ */
const clock = new THREE.Clock();
const smokeBase = new THREE.Vector3(-6.2 + 1.5, 3.95, -6.2 - 0.5);
const _skyA = new THREE.Color(), _skyB = new THREE.Color();
let bodyNight = false;

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* --- 白天/夜晚过渡 --- */
  if (timeAuto) {
    envTarget = envFromHour(cityHourFrac(currentCity.tz));
    syncDayButton();
  }
  clockTime.textContent = currentCity.name + ' ' + cityHM(currentCity.tz);
  env += (envTarget - env) * Math.min(1, delta * 1.6);
  if ((env > 0.5) !== bodyNight) { bodyNight = env > 0.5; document.body.classList.toggle('night', bodyNight); }
  tickAmbientAudio();
  const e = env;
  {
    const ov = weatherMul.cloudGray * 0.85;
    _skyA.copy(DAY.skyTop).lerp(OVERCAST.dayTop, ov);
    _skyB.copy(NIGHT.skyTop).lerp(OVERCAST.nightTop, ov);
    skyMat.uniforms.topColor.value.copy(_skyA).lerp(_skyB, e);
    _skyA.copy(DAY.skyBottom).lerp(OVERCAST.dayBottom, ov);
    _skyB.copy(NIGHT.skyBottom).lerp(OVERCAST.nightBottom, ov);
    skyMat.uniforms.bottomColor.value.copy(_skyA).lerp(_skyB, e);
  }
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, e);
  hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, e);
  hemi.intensity = THREE.MathUtils.lerp(DAY.hemiInt, NIGHT.hemiInt, e);
  sun.color.copy(DAY.sunCol).lerp(NIGHT.sunCol, e);
  sun.intensity = THREE.MathUtils.lerp(DAY.sunInt, NIGHT.sunInt, e);
  sun.position.copy(DAY.sunPos).lerp(NIGHT.sunPos, e);
  ambient.color.copy(DAY.ambCol).lerp(NIGHT.ambCol, e);
  ambient.intensity = THREE.MathUtils.lerp(DAY.ambInt, NIGHT.ambInt, e);
  sunDisc.material.opacity = 1 - e;
  moon.material.opacity = e;
  starMat.opacity = e;
  // 夜里窗户要像便利店橱窗那样亮到发光（交给泛光）；人在屋里时收着点，免得窗玻璃挡住外景
  glassMat.emissiveIntensity = 0.05 + e * (interiorMode ? 1.2 : 3.4);
  for (const lm of lanternMats) lm.emissiveIntensity = e * 2.4;
  for (const g of streetGlowMats) {
    const v = g.base + g.night * e;
    if (g.mat) g.mat.emissiveIntensity = v;
    else { g.pool.material.opacity = v; g.pool.visible = v > 0.01; }
  }
  for (const pl of lanternLights) pl.intensity = e * 1.5;
  for (const bb of bulbs) {
    const chase = Math.pow(Math.max(Math.sin((t * 0.7 - bb.idx / bulbs.length) * Math.PI * 2), 0), 5);
    bb.br = chase;
    bb.mat.emissiveIntensity = e * (0.3 + chase * 2.4);
  }
  fireflyMat.opacity = e;

  weatherMul.sun += (weatherGoal.sun - weatherMul.sun) * Math.min(1, delta * 1.2);
  weatherMul.cloudGray += (weatherGoal.cloudGray - weatherMul.cloudGray) * Math.min(1, delta * 1.2);
  weatherMul.fog += (weatherGoal.fog - weatherMul.fog) * Math.min(1, delta * 0.8);
  weatherMul.wet += (weatherGoal.wet - weatherMul.wet) * Math.min(1, delta * 0.6);
  sun.intensity *= weatherMul.sun;

  // 雨后彩虹：雨刚停时先记着，天亮(或已白天)就浮现 22 秒再缓缓消隐
  if (rainbowPending && env < 0.55) {
    rainbowUntil = t + 22;
    rainbowPending = false;
  }
  {
    const want = t < rainbowUntil ? 1 : 0;
    rainbowFade += (want - rainbowFade) * Math.min(1, delta * 0.5);
    const rop = rainbowFade * 0.38 * (1 - env);
    rainbow.visible = rop > 0.012;
    if (rainbow.visible) {
      for (const arc of rainbow.children) arc.material.opacity = rop;
      rainbow.rotation.z = Math.sin(t * 0.11) * 0.02;   // 极轻微的摇曳
    }
  }

  /* --- 小女孩：随机散步 --- */
  const gs = girlS();   // 院子里 / 屋里两种缩放（屋子内部自身缩放了 0.5）
  girl.scale.setScalar(gs);
  const holdUmb = umbrellaOpen > 0.05;   // 撑伞期间右臂姿态交给雨伞逻辑，状态机不再覆写
  const excited = t < excitedUntil;
  if (excited) {
    // 被点中：原地蹦跳 + 挥手
    girl.position.y = Math.abs(Math.sin(t * 9)) * 0.16;
    girl.scale.y = gs;
    head.rotation.z = Math.sin(t * 1.3) * 0.05;
    head.rotation.y = Math.sin(t * 6) * 0.1;
    armL.rotation.z = -0.28;
    if (!holdUmb) armR.rotation.z = 2.35 + Math.sin(t * 11) * 0.45;   // 右臂高举向外挥手
    armL.rotation.x = 0;
    if (!holdUmb) armR.rotation.x = 0;
    legL.rotation.x = legR.rotation.x = 0;
    tails[0].rotation.z = 0.16 + Math.sin(t * 4) * 0.2;
    tails[1].rotation.z = -0.16 - Math.sin(t * 4 + 0.5) * 0.2;
    tails[0].rotation.x = tails[1].rotation.x = 0;
  } else if (walk.state === 'walk') {
    // 走向目标点
    const dx = walk.target.x - girl.position.x;
    const dz = walk.target.y - girl.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.25) {
      if (walk.spot) { startActivity(walk.spot, t); }   // 到达活动点：坐下 / 上秋千 / 看鱼 / 进屋
      else {
        walk.state = 'idle';
        walk.idleUntil = t + 1.5 + Math.random() * 3;
        girl.position.y = 0;
      }
    } else {
      const step = Math.min(WALK_SPEED * delta, dist);
      girl.position.x += (dx / dist) * step;
      girl.position.z += (dz / dist) * step;
      // 平滑转向前进方向（模型正面朝 +z）
      walk.heading = lerpAngle(walk.heading, Math.atan2(dx, dz), Math.min(1, delta * 8));
      girl.rotation.y = walk.heading;
      // 步伐循环
      walk.phase += delta * 7.2;
      const sw = Math.sin(walk.phase);
      legL.rotation.x = sw * 0.55;
      legR.rotation.x = -sw * 0.55;
      armL.rotation.x = -sw * 0.35;
      if (!holdUmb) armR.rotation.x = sw * 0.35;
      armL.rotation.z = -0.3;
      if (!holdUmb) armR.rotation.z = 0.3;
      girl.position.y = Math.abs(Math.sin(walk.phase)) * 0.035;
      girl.scale.y = gs;
      head.rotation.z = Math.sin(walk.phase * 0.5) * 0.04;
      head.rotation.y = Math.sin(t * 0.6) * 0.1;
      head.rotation.x = 0.04;
      tails[0].rotation.z = 0.16 + Math.sin(walk.phase) * 0.18;
      tails[1].rotation.z = -0.16 - Math.sin(walk.phase + 0.5) * 0.18;
      tails[0].rotation.x = tails[1].rotation.x = Math.sin(walk.phase) * 0.15;
      dress.rotation.y = Math.sin(walk.phase * 0.5) * 0.04;
    }
  } else if (walk.state === 'sit' || walk.state === 'rise') {
    // 长椅：坐下/起身（0→1 混合出落座的过渡，带一点扑坐的小弧线）
    walk.blend = Math.min(1, walk.blend + delta * 1.8);
    const b = walk.blend * walk.blend * (3 - 2 * walk.blend);
    const k = walk.state === 'sit' ? b : 1 - b;
    girl.position.lerpVectors(walk.fromPos, walk.toPos, b);
    girl.position.y += Math.sin(b * Math.PI) * 0.22;
    girl.rotation.y = lerpAngle(walk.fromRotY, walk.toRotY, b);
    legL.rotation.x = legR.rotation.x = -1.4 * k;         // 腿向前伸
    legL.rotation.z = 0.06 * k; legR.rotation.z = -0.06 * k;
    armL.rotation.x = -0.55 * k;                          // 手搭在腿上
    armL.rotation.z = -0.28;
    if (!holdUmb) { armR.rotation.x = -0.55 * k; armR.rotation.z = 0.32; }
    head.rotation.z = Math.sin(t * 1.3) * 0.04;
    head.rotation.y = Math.sin(t * 0.5) * 0.18;
    head.rotation.x = 0.03 * k;
    tails[0].rotation.z = 0.16 + Math.sin(t * 1.8) * 0.1;
    tails[1].rotation.z = -0.16 - Math.sin(t * 1.8 + 0.5) * 0.1;
    tails[0].rotation.x = tails[1].rotation.x = 0;
    if (walk.blend >= 1) {
      if (walk.state === 'sit' && t > walk.actUntil) {
        walk.state = 'rise';                              // 该起来了
        [walk.fromPos, walk.toPos] = [walk.toPos.clone(), walk.approachPos.clone()];
        [walk.fromRotY, walk.toRotY] = [walk.toRotY, walk.approachRotY];
      } else if (walk.state === 'rise') {
        walk.state = 'idle';
        girl.position.y = 0;
        legL.rotation.z = legR.rotation.z = 0;
        walk.idleUntil = t + 0.8;
        walk.spot = null;
      }
    }
  } else if (walk.state === 'toSwing') {
    // 走到秋千旁站好，等坐垫荡回最低点时起跳，和小熊并排坐
    if (walk.hopT < 0) {
      walk.blend = Math.min(1, walk.blend + delta * 1.6);
      const b = walk.blend * walk.blend * (3 - 2 * walk.blend);
      girl.position.lerpVectors(walk.fromPos, walk.toPos, b);
      girl.rotation.y = lerpAngle(walk.fromRotY, walk.toRotY, b);
      legL.rotation.x = legR.rotation.x = 0;
      armL.rotation.x = 0;
      if (!holdUmb) armR.rotation.x = 0;
      if (walk.blend >= 1 && Math.abs(swingPivot.rotation.x) < 0.06) walk.hopT = 0;
    } else {
      walk.hopT = Math.min(1, walk.hopT + delta * 2.6);
      const ht = walk.hopT;
      const seatW = swingSeat.localToWorld(new THREE.Vector3(SWING_SIT.x, SWING_SIT.y, SWING_SIT.z));
      girl.position.lerpVectors(walk.toPos, seatW, ht);
      girl.position.y += Math.sin(ht * Math.PI) * 0.35;   // 抛物线小跳
      girl.rotation.y = lerpAngle(walk.toRotY, 0, ht);
      legL.rotation.x = legR.rotation.x = -0.5;           // 空中屈膝准备落座
      if (ht >= 1) {
        swingSeat.add(girl);
        girl.position.set(SWING_SIT.x, SWING_SIT.y, SWING_SIT.z);
        girl.rotation.set(0, 0, 0);
        walk.state = 'swing';
      }
    }
  } else if (walk.state === 'swing') {
    // 荡秋千：腿前伸、双手抓绳，马尾随摆幅飘
    const swA = swingPivot.rotation.x;
    legL.rotation.x = legR.rotation.x = -1.35;
    legL.rotation.z = 0.05; legR.rotation.z = -0.05;
    armL.rotation.x = -2.2; armL.rotation.z = -0.45;
    if (!holdUmb) { armR.rotation.x = -2.2; armR.rotation.z = 0.45; }
    head.rotation.z = Math.sin(t * 1.3) * 0.04;
    head.rotation.y = 0;
    tails[0].rotation.x = tails[1].rotation.x = 0.3 + swA * 1.3;
    tails[0].rotation.z = 0.16; tails[1].rotation.z = -0.16;
    girl.position.y = SWING_SIT.y + Math.abs(Math.sin(t * 2.2)) * 0.008;
    if (t > walk.actUntil && Math.abs(swingPivot.rotation.x) < 0.05) {
      diorama.attach(girl);                               // 荡回低点时跳下来
      walk.hopFrom = girl.position.clone();
      walk.hopFromY = walk.hopFrom.y;
      walk.toPos = new THREE.Vector3(6.35, 0, -2.9);
      walk.hopT = 0;
      girl.rotation.x = 0; girl.rotation.z = 0;
      walk.state = 'hopOff';
    }
  } else if (walk.state === 'hopOff') {
    // 从秋千跳落到草地的小弧线
    walk.hopT = Math.min(1, walk.hopT + delta * 2.6);
    const ht = walk.hopT;
    girl.position.lerpVectors(walk.hopFrom, walk.toPos, ht);
    girl.position.y = THREE.MathUtils.lerp(walk.hopFromY, 0, ht) + Math.sin(ht * Math.PI) * 0.3;
    legL.rotation.x = legR.rotation.x = -0.4 * Math.sin(ht * Math.PI);
    if (ht >= 1) {
      girl.position.y = 0;
      legL.rotation.x = legR.rotation.x = 0;
      legL.rotation.z = legR.rotation.z = 0;
      walk.state = 'idle';
      walk.idleUntil = t + 1;
      walk.spot = null;
    }
  } else if (walk.state === 'watch') {
    // 池塘边看鱼：背着手看小鸭和锦鲤，偶尔歪头
    girl.rotation.y = lerpAngle(girl.rotation.y, walk.heading, Math.min(1, delta * 5));
    girl.position.y = Math.abs(Math.sin(t * 2)) * 0.012;
    girl.scale.y = gs;
    armL.rotation.x = 0.35; armL.rotation.z = -0.18;
    if (!holdUmb) { armR.rotation.x = 0.35; armR.rotation.z = 0.18; }
    head.rotation.z = Math.sin(t * 0.9) * 0.06;
    head.rotation.y = Math.sin(t * 0.4) * 0.12;
    head.rotation.x = 0.06;
    tails[0].rotation.z = 0.16 + Math.sin(t * 1.6) * 0.08;
    tails[1].rotation.z = -0.16 - Math.sin(t * 1.6 + 0.5) * 0.08;
    tails[0].rotation.x = tails[1].rotation.x = 0;
    if (t > walk.actUntil) {
      walk.state = 'idle';
      girl.position.y = 0;
      walk.idleUntil = t + 1;
      walk.spot = null;
    }
  } else if (walk.state === 'enter' || walk.state === 'exit') {
    // 走进屋门 / 从屋里走出来
    walk.blend = Math.min(1, walk.blend + delta * 1.3);
    const b = walk.blend * walk.blend * (3 - 2 * walk.blend);
    girl.position.lerpVectors(walk.fromPos, walk.toPos, b);
    girl.rotation.y = lerpAngle(walk.fromRotY, walk.toRotY, b);
    const step = Math.sin(t * 9) * 0.4;
    legL.rotation.x = step; legR.rotation.x = -step;
    armL.rotation.x = -step * 0.6;
    if (!holdUmb) armR.rotation.x = step * 0.6;
    if (walk.blend >= 1) {
      if (walk.state === 'enter') {
        roomGroup.add(girl);                              // 进屋：从起居室前门进来
        girl.position.set(-2.3, 0, 2.9);
        girl.rotation.set(0, Math.PI, 0);
        girl.visible = true;
        iGirl.state = 'walk';
        iGirl.path = routeTo(-2.3, 2.9, -2.9, 0.3);
        iGirl.act = null;
        walk.state = 'inside';
      } else {
        walk.state = 'idle';
        walk.idleUntil = t + 1;
        walk.spot = null;
      }
    }
  } else if (walk.state === 'inside') {
    // 在屋里：看她走来走去 / 坐桌前 / 坐床沿 / 看窗外 / 看书架
    updateInteriorGirl(delta, t, holdUmb);
    if (t > walk.actUntil) {                              // 休息结束，出门
      diorama.add(girl);
      girl.position.set(DOOR_POS.x, 0, DOOR_POS.z);
      girl.rotation.set(0, 0, 0);
      walk.state = 'exit';
      walk.fromPos = girl.position.clone();
      walk.toPos = walk.approachPos.clone();
      walk.toRotY = Math.atan2(walk.approachPos.x - DOOR_POS.x, walk.approachPos.z - DOOR_POS.z);
      walk.fromRotY = walk.toRotY;
    }
  } else {
    // 原地休息：呼吸、左顾右盼
    girl.position.y = Math.abs(Math.sin(t * 2.2)) * 0.018;
    girl.scale.y = gs * (1 + Math.sin(t * 2) * 0.008);
    head.rotation.z = Math.sin(t * 1.3) * 0.05;
    head.rotation.y = Math.sin(t * 0.6) * 0.14;
    head.rotation.x = 0;
    armL.rotation.z = -0.28 - Math.sin(t * 2) * 0.07;
    if (!holdUmb) armR.rotation.z = 0.32 + Math.sin(t * 2 + 1) * 0.07;
    armL.rotation.x = 0;
    if (!holdUmb) armR.rotation.x = 0;
    legL.rotation.x = legR.rotation.x = 0;
    tails[0].rotation.z = 0.16 + Math.sin(t * 2.6) * 0.13;
    tails[1].rotation.z = -0.16 - Math.sin(t * 2.6 + 0.5) * 0.13;
    tails[0].rotation.x = tails[1].rotation.x = Math.sin(t * 1.8) * 0.08;
    dress.rotation.y = Math.sin(t * 2.2) * 0.03;
    if (t > walk.idleUntil) {
      pickTarget();
      walk.state = 'walk';
    }
  }

  // 雨天撑伞：右臂缓缓举到头顶，伞面随之撑开；雨停后收起
  umbrellaOpen += ((weather.kind === 'rain' ? 1 : 0) - umbrellaOpen) * Math.min(1, delta * 3.2);
  umbrella.visible = umbrellaOpen > 0.04;
  umbrella.scale.setScalar(Math.max(0.001, umbrellaOpen));
  poseGirlRig(delta);   // 驱动 → 骨骼（膝 / 肘 / 长发 / 撑伞姿势 / 伞杆扶正 / VRM 人物）

  /* --- 小猫 / 秋千 / 树 / 晾衣 / 涟漪 --- */
  if (t < catExcitedUntil) {
    cat.position.y = Math.abs(Math.sin(t * 10)) * 0.14;    // 被点中：蹦跳 + 尾巴快摇
    cat.userData.tail.rotation.y = Math.sin(t * 14) * 0.6;
    catHead.rotation.y = Math.sin(t * 3) * 0.5;
  } else {
    cat.position.y = 0;
    cat.userData.tail.rotation.y = Math.sin(t * 2.6) * 0.35;
    catHead.rotation.y = Math.sin(t * 0.5) * 0.35;
  }
  swingPivot.rotation.x = Math.sin(t * 0.85) * 0.22;
  // 屋门：小女孩进出屋时缓缓敞开
  const doorWant = (interiorMode || walk.state === 'enter' || walk.state === 'inside' || walk.state === 'exit') ? 1.65 : 0;
  doorG.rotation.y += (doorWant - doorG.rotation.y) * Math.min(1, delta * 3.5);
  for (const tr of trees) {
    tr.userData.foliage.rotation.z = Math.sin(t * 0.9 + tr.userData.phase) * 0.028;
    tr.userData.foliage.rotation.x = Math.sin(t * 0.7 + tr.userData.phase * 2) * 0.02;
  }
  for (const c of laundry) {
    c.rotation.y = Math.sin(t * 2.2 + c.userData.phase) * 0.35;
    c.rotation.z = Math.sin(t * 1.7 + c.userData.phase) * 0.1;
  }
  for (const r of ripples) {
    const life = (t * 0.35 + r.userData.phase) % 1;
    r.scale.setScalar(0.4 + life * 1.9);
    r.material.opacity = (1 - life) * 0.35;
  }

  /* --- 气球 / 悬浮小岛 / 炊烟 --- */
  balloon.position.y = 2.6 + Math.sin(t * 1.3) * 0.12;
  balloon.rotation.z = Math.sin(t * 0.8) * 0.08;
  for (const isl of floatingIslands) {
    isl.position.y = isl.userData.baseY + Math.sin(t * 0.5 + isl.userData.phase) * 0.18;
    isl.rotation.y = Math.sin(t * 0.3 + isl.userData.phase) * 0.02;
  }
  for (const sp of smoke) {
    const life = (t * 0.22 + sp.userData.phase) % 1;
    sp.position.set(
      smokeBase.x + Math.sin(life * 6 + sp.userData.phase * 8) * 0.25,
      smokeBase.y + life * 2.4,
      smokeBase.z
    );
    sp.scale.setScalar(0.35 + life * 1.1);
    sp.material.opacity = Math.sin(life * Math.PI) * 0.4;
  }

  /* --- 蝴蝶 / 小鸟 / 白云 --- */
  for (const b of butterflies) {
    const u = b.userData;
    const a = t * u.speed + u.phase;
    b.position.set(
      u.cx + Math.cos(a) * u.r,
      u.h + Math.sin(a * 2.3) * 0.25,
      u.cz + Math.sin(a) * u.r * 0.7
    );
    b.rotation.y = Math.atan2(-Math.sin(a), 0.7 * Math.cos(a));   // 椭圆航线速度方向
    const flap = Math.sin(t * u.flap + u.phase) * 0.95;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  }
  for (const bd of birds) {
    const u = bd.userData;
    const a = t * u.speed + u.phase;
    bd.position.set(Math.cos(a) * u.r, u.h + Math.sin(a * 3) * 0.6, Math.sin(a) * u.r);
    bd.rotation.y = -a;
    const flap = Math.sin(t * 7 + u.phase) * 0.7;
    u.wl.rotation.z = flap;
    u.wr.rotation.z = -flap;
  }
  for (const cl of clouds) {
    cl.position.x += cl.userData.speed * delta;
    cl.position.y += Math.sin(t * 0.4 + cl.userData.phase) * 0.002;
    if (cl.position.x > 42) cl.position.x = -42;
  }

  /* --- 萤火虫 --- */
  {
    const pos = fireflyGeo.attributes.position;
    const col = fireflyGeo.attributes.color;
    for (let i = 0; i < fireflyCount; i++) {
      pos.array[i * 3] = fireflyBase[i * 3] + Math.sin(t * 0.7 + i * 1.7) * 0.6;
      pos.array[i * 3 + 1] = fireflyBase[i * 3 + 1] + Math.sin(t * 1.1 + i * 2.3) * 0.35;
      pos.array[i * 3 + 2] = fireflyBase[i * 3 + 2] + Math.cos(t * 0.5 + i * 0.9) * 0.6;
      // 各自独立的亮灭脉冲：快亮慢熄，留一点余烬微光
      const p = (t * fireflyBlink[i].spd + fireflyBlink[i].ph) % 1;
      const br = Math.pow(Math.max(Math.sin(p * Math.PI * 2), 0), 6) * 0.95 + 0.05;
      col.array[i * 3] = col.array[i * 3 + 1] = col.array[i * 3 + 2] = br;
    }
    pos.needsUpdate = true;
    col.needsUpdate = true;
  }

  /* ========== 增补元素动画 ========== */
  fillLight.intensity = THREE.MathUtils.lerp(0.35, 0.1, env) * (0.65 + 0.35 * weatherMul.sun);
  cloudMat.color.setRGB(
    1 - weatherMul.cloudGray * 0.35,
    1 - weatherMul.cloudGray * 0.32,
    1 - weatherMul.cloudGray * 0.28
  ).multiplyScalar(1 - env * 0.55);
  stormCloudMat.color.setRGB(
    0.77 - weatherMul.cloudGray * 0.22,
    0.81 - weatherMul.cloudGray * 0.20,
    0.84 - weatherMul.cloudGray * 0.18
  ).multiplyScalar(1 - env * 0.6);
  grassMat.color.setHex(0x8ec963).lerp(new THREE.Color(0x5a8a48), weatherMul.wet * 0.55);
  innerGround.material.color.copy(innerBase).lerp(innerWet, weatherMul.wet);
  dirtMat.color.copy(dirtBase).lerp(dirtWet, weatherMul.wet);
  scene.fog.density = 0.00001 + weatherMul.fog * 0.018;
  scene.fog.color.copy(skyMat.uniforms.bottomColor.value);
  renderer.setClearColor(skyMat.uniforms.bottomColor.value, 1);
  fogHaze.material.color.copy(skyMat.uniforms.bottomColor.value);
  fogHaze.material.opacity = weatherMul.fog * 0.22;
  fogHaze.visible = weatherMul.fog > 0.04;

  if (rainLines.visible) {
    const arr = rainGeo.attributes.position.array;
    for (let i = 0; i < rainLive; i++) {
      const dy = rainSpd[i] * delta;
      arr[i * 6 + 1] -= dy;
      arr[i * 6 + 4] -= dy;
      arr[i * 6] += 1.6 * delta;
      arr[i * 6 + 3] += 1.6 * delta;
      if (arr[i * 6 + 4] < 0) {
        const x = (Math.random() - 0.5) * 46;
        // 雨丝只在院子上空 ~14 以下落：默认俯视机位在 y≈17，再高就会贴着镜头划出超长的线
        const y = 10 + Math.random() * 4;
        const z = (Math.random() - 0.5) * 40;
        const len = rainLen[i];
        arr[i * 6]     = x;
        arr[i * 6 + 1] = y;
        arr[i * 6 + 2] = z;
        arr[i * 6 + 3] = x + 0.12;
        arr[i * 6 + 4] = y - len;
        arr[i * 6 + 5] = z;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  if (snowPoints.visible) {
    const arr = snowPoints.geometry.attributes.position.array;
    const spd = snowPoints.userData.spd;
    for (let i = 0; i < snowLive; i++) {
      arr[i*3 + 1] -= (1.6 + spd[i] * 1.2) * delta;
      arr[i*3] += Math.sin(t * 0.8 + i) * 0.4 * delta;
      if (arr[i*3 + 1] < 0) {
        arr[i*3 + 1] = 16 + Math.random() * 10;
        arr[i*3] = (Math.random() - 0.5) * 48;
        arr[i*3 + 2] = (Math.random() - 0.5) * 42;
      }
    }
    snowPoints.geometry.attributes.position.needsUpdate = true;
  }

  // 夜晚光晕呼吸
  for (const bb of bulbs) bb.glow.material.opacity = e * (0.05 + bb.br * 0.62);
  for (const gsp of lanternGlows) gsp.material.opacity = e * (0.62 + Math.abs(Math.sin(t * 9)) * 0.12);
  for (const gsp of windowGlows) gsp.material.opacity = e * 0.33;

  // 微波水面
  {
    const wpa = waveGeo.attributes.position;
    for (let vi = 0; vi < wpa.count; vi++)
      wpa.array[vi * 3 + 1] = Math.sin(t * 2.3 + waveBase[vi * 3] * 2.4 + waveBase[vi * 3 + 2] * 3.1) * 0.018;
    wpa.needsUpdate = true;
  }

  // 风车迎风转动
  for (let i = 0; i < pinwheels.length; i++)
    pinwheels[i].rotation.z -= delta * (2.6 + Math.sin(t * 0.7 + i * 2.2) * 1.1);

  // 向日葵：白天花盘追随太阳方向，入夜缓缓垂头
  for (const h of sunflowerHeads) {
    h.getWorldPosition(SF_TMP);
    SF_TMP.copy(sun.position).sub(SF_TMP).normalize();
    SF_TMP.lerp(h.userData.droop, e * e).normalize();   // 平方缓入，垂头只在深夜明显
    h.quaternion.setFromUnitVectors(SF_UP, SF_TMP);
    h.rotateZ(Math.sin(t * 0.6 + h.userData.ph) * 0.035);
  }

  // 樱花瓣飘落
  for (const p of petals) {
    if (!p.on) {
      if (t > p.next) {
        p.on = true;
        p.m.visible = true;
        const em = EMITTERS[(Math.random() * EMITTERS.length) | 0];
        p.m.position.set(
          em.x + (Math.random() - 0.5) * 1.9,
          em.y + Math.random() * 0.4,
          em.z + (Math.random() - 0.5) * 1.9
        );
        p.vx = 0.12 + Math.random() * 0.25;
        p.vz = (Math.random() - 0.5) * 0.22;
        p.rx = (Math.random() - 0.5) * 7;
        p.rz = (Math.random() - 0.5) * 7;
      }
      continue;
    }
    p.m.position.x += p.vx * delta;
    p.m.position.z += p.vz * delta;
    p.m.position.y -= (0.48 + Math.sin(t * 3 + p.vx * 9) * 0.14) * delta;
    p.m.rotation.x += p.rx * delta;
    p.m.rotation.z += p.rz * delta;
    if (p.m.position.y < 0.04) {
      p.on = false;
      p.m.visible = false;
      p.next = t + 0.3 + Math.random() * 1.8;
    }
  }

  // 锦鲤巡游
  for (const k of kois) {
    const ka = t * k.spd + k.phase;
    k.g.position.set(Math.cos(ka) * k.r, 0.05, Math.sin(ka) * k.r * k.squash);
    k.g.rotation.y = Math.atan2(-Math.sin(ka), Math.cos(ka) * k.squash);
    k.tail.rotation.z = Math.sin(t * 9 + k.phase * 3) * 0.35;
  }
  // 青蛙鼓腮呼吸
  frogThroat.scale.setScalar(1 + Math.max(0, Math.sin(t * 2.6)) * 0.6);
  frogBody.scale.y = 0.8 + Math.sin(t * 2.6) * 0.02;

  // 鸭子排队游
  for (const d of duckTrain) {
    const da = t * 0.4 - d.off;
    d.g.position.set(
      Math.cos(da) * 1.5,
      (d.g.scale.x > 1 ? 0.19 : 0.175) + Math.sin(t * 8 + d.wob) * 0.006,
      Math.sin(da) * 1.05
    );
    d.g.rotation.y = Math.atan2(-Math.sin(da) * 1.5, Math.cos(da) * 1.05);
    d.g.rotation.z = Math.sin(t * 7 + d.wob) * 0.05;   // 划水摇摆
  }

  // 小蜜蜂绕花采蜜
  for (const b of bees) {
    const u = b.userData, ba = t * u.sp + u.ph;
    b.position.set(u.c.x + Math.cos(ba) * u.r, u.h + Math.sin(ba * 3.1) * 0.12, u.c.y + Math.sin(ba) * u.r * 0.85);
    b.rotation.y = -ba + Math.PI / 2;
    const bf = Math.sin(t * 42 + u.ph) * 0.85;
    u.wl.rotation.z = bf; u.wr.rotation.z = -bf;
  }

  // 小兔子蹦跶
  if (bunnyState.mode === 'celebrate') {
    const bounce = Math.abs(Math.sin(t * 10));   // 被点中：原地欢快蹦跳 + 耳朵竖起
    bunny.position.y = bounce * 0.2;
    bunnyBody.scale.y = 0.95 * (0.94 + bounce * 0.12);
    bunny.userData.ears.forEach(e => { e.rotation.x = -0.55 * bounce; });
    bunnyHead.rotation.y = Math.sin(t * 4) * 0.3;
    if (t > bunnyState.until) {
      bunnyState.mode = 'rest';
      bunnyState.idleUntil = t + 2;
      bunny.position.y = 0;
    }
  } else if (bunnyState.mode === 'rest') {
    bunny.position.y = 0;
    bunnyBody.scale.y = 0.95 * (1 + Math.sin(t * 3) * 0.02);   // 呼吸
    const twitch = Math.sin(t * 1.9) > 0.986 ? Math.sin(t * 55) * 0.3 : 0;   // 耳朵偶尔抖动
    bunny.userData.ears.forEach(e => { e.rotation.x = twitch; });
    bunnyHead.rotation.y = Math.sin(t * 0.8) * 0.25;
    if (t > bunnyState.idleUntil) {
      bunnyPick();
      bunnyState.mode = 'hop';
    }
  } else {
    const bdx = bunnyState.tx - bunny.position.x;
    const bdz = bunnyState.tz - bunny.position.z;
    const bdist = Math.hypot(bdx, bdz);
    if (bdist < 0.2) {
      bunnyState.mode = 'rest';
      bunnyState.idleUntil = t + 1.5 + Math.random() * 3.5;
      bunny.position.y = 0;
    } else {
      const bs = Math.min(delta * 1.05, bdist);
      bunny.position.x += (bdx / bdist) * bs;
      bunny.position.z += (bdz / bdist) * bs;
      bunny.rotation.y = lerpAngle(bunny.rotation.y, Math.atan2(bdx, bdz), Math.min(1, delta * 7));
      const bounce = Math.abs(Math.sin(t * 8.5));
      bunny.position.y = bounce * 0.17;
      bunnyBody.scale.y = 0.95 * (0.94 + bounce * 0.1);
      bunny.userData.ears.forEach(e => { e.rotation.x = -0.5 * bounce; });
      bunnyHead.rotation.y = 0;
    }
  }

  // 流星（只在夜晚出现）
  for (const m of meteors) {
    if (!m.active) {
      if (env > 0.65 && t > m.nextAt) {
        m.active = true;
        const ma = Math.random() * Math.PI * 2, me = 0.75 + Math.random() * 0.35, mr = 150;
        m.pos.set(Math.cos(ma) * Math.cos(me) * mr, Math.sin(me) * mr, Math.sin(ma) * Math.cos(me) * mr);
        m.vel.set(-Math.cos(ma) * 26 + (Math.random() - 0.5) * 14, -34, -Math.sin(ma) * 26 + (Math.random() - 0.5) * 14);
        m.hist = [];
        m.endAt = t + 1.5;
        m.head.scale.setScalar(2.6);
      }
      continue;
    }
    m.pos.addScaledVector(m.vel, delta);
    m.hist.unshift(m.pos.clone());
    if (m.hist.length > 20) m.hist.pop();
    const fade = Math.max(0, Math.min(1, (m.endAt - t) / 0.45)) * env;
    m.head.position.copy(m.pos);
    m.head.material.opacity = fade;
    m.trail.forEach((ts, k) => {
      const hp = m.hist[Math.min(k * 3 + 2, m.hist.length - 1)];
      if (hp) ts.position.copy(hp);
      ts.scale.setScalar(2.1 - k * 0.24);
      ts.material.opacity = fade * (1 - k / 8) * 0.8;
    });
    if (t > m.endAt + 0.5) {
      m.active = false;
      m.head.material.opacity = 0;
      m.trail.forEach(ts => ts.material.opacity = 0);
      m.nextAt = t + 7 + Math.random() * 9;
    }
  }

  // 家具点按：短促看向目标
  if (furnLook && interiorMode && !camTransit) {
    const u = Math.min(1, (t - furnLook.t0) / furnLook.dur);
    const e2 = u * u * (3 - 2 * u);
    let dy = furnLook.toY - furnLook.fromY;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    interiorCam.yaw = furnLook.fromY + dy * e2;
    interiorCam.pitch = furnLook.fromP + (furnLook.toP - furnLook.fromP) * e2;
    if (u >= 1) furnLook = null;
  }
  updatePopAnims(t);
  updateSparks(delta);

  if (camTransit) {
    updateCamTransit(delta);
  } else if (interiorMode) {
    // 室内漫游：WASD/方向键 + 触控摇杆
    const mv = new THREE.Vector3();
    if (roomKeys['w'] || roomKeys['arrowup']) mv.z -= 1;
    if (roomKeys['s'] || roomKeys['arrowdown']) mv.z += 1;
    if (roomKeys['a'] || roomKeys['arrowleft']) mv.x -= 1;
    if (roomKeys['d'] || roomKeys['arrowright']) mv.x += 1;
    if (touchMove.active && (touchMove.x || touchMove.y)) {
      mv.x += touchMove.x;
      mv.z += touchMove.y;
    }
    if (mv.lengthSq() > 0) {
      mv.normalize().applyAxisAngle(UP_Y, interiorCam.yaw);
      camL.x += mv.x * 1.3 * delta;
      camL.z += mv.z * 1.3 * delta;
      [camL.x, camL.z] = resolveRoomClip(camL.x, camL.z, 0.3);
      noteIndoorInput();
    }
    indoorEyePos(camera.position);
    camera.rotation.order = 'YXZ';
    camera.rotation.set(interiorCam.pitch, interiorCam.yaw, 0);
  } else {
    controls.update();
  }
  renderFrame(t);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (post) post.resize();
  if (interiorMode && !camTransit) syncTouchChrome(true);
});

document.getElementById('loading').classList.add('hide');

// 调试探针：控制台可用 __yard() 查看内部状态；__yardStep(n) 手动推进 n 帧（页面在后台 rAF 暂停时用）
const __scr = v => { const p = v.clone().project(camera); return [Math.round((p.x * 0.5 + 0.5) * innerWidth), Math.round((-p.y * 0.5 + 0.5) * innerHeight)]; };
window.__yard = () => ({ env, envTarget, timeAuto, umbrellaOpen, wx: weather.kind, rainbowPending, rainbowFade, autoRotate: controls.autoRotate, audio: audioWanted,
  state: walk.state, spot: walk.spot ? walk.spot.kind : null,
  armX: +armR.rotation.x.toFixed(2), armZ: +armR.rotation.z.toFixed(2),
  upos: umbrella.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)),
  gpos: girl.position.toArray().map(v => +v.toFixed(2)),
  girlScr: __scr(girl.getWorldPosition(new THREE.Vector3())), catScr: __scr(cat.position.clone().setY(0.3)), bunnyScr: __scr(bunny.position.clone().setY(0.15)),
  houseScr: __scr(house.position.clone().setY(1.2)), doorScr: __scr(roomExitDoor.getWorldPosition(new THREE.Vector3())),
  imode: interiorMode, camTransit: camTransit && camTransit.kind, cam: camera.position.toArray().map(v => +v.toFixed(2)),
  catY: +cat.position.y.toFixed(3), bunnyMode: bunnyState.mode, catExcited: clock.elapsedTime < catExcitedUntil,
  istate: iGirl.state, iact: iGirl.act, iblend: +iGirl.blend.toFixed(2), iuntil: +(iGirl.until - clock.elapsedTime).toFixed(1) });
window.__yardEnter = () => enterInterior();
window.__yardExit = () => exitInterior();
window.__yardCam = (x, z, yaw, pitch) => { camL.x = x; camL.z = z; if (yaw != null) interiorCam.yaw = yaw; if (pitch != null) interiorCam.pitch = pitch; };   // 调试：室内相机传送（房间局部坐标）
window.__room = roomGroup; window.__scene = scene; window.__camera = camera; window.__house = house; window.__shellWalls = shellWalls;
window.__yardGoto = kind => {
  const s = SPOTS.find(sp => sp.kind === kind);
  if (!s) return false;
  cancelActivity();
  walk.spot = s;
  walk.state = 'walk';
  walk.target.set(s.ax, s.az);
  return true;
};
window.__pick = (x, y) => {
  setPointerFromClient(x, y);
  camera.updateMatrixWorld(true);
  raycaster.setFromCamera(pointer, camera);
  const doorObjs = [roomExitDoor, doorG, doorExitHit].filter(Boolean);
  return {
    cat: raycaster.intersectObject(cat, true).length,
    bunny: raycaster.intersectObject(bunny, true).length,
    girl: raycaster.intersectObjects(girlMeshes, false).length,
    door: raycaster.intersectObjects(doorObjs, true).length,
    house: raycaster.intersectObjects(houseMeshes, false).length,
    doorway: rayHitsDoorway() ? 1 : 0
  };
};
window.__yardHurry = () => { walk.actUntil = Math.min(walk.actUntil || Infinity, clock.elapsedTime + 0.3); };   // 调试：立刻结束当前活动
window.__yardStay = sec => { if (walk.state === 'inside') walk.actUntil = Math.max(walk.actUntil, clock.elapsedTime + sec); };   // 调试：延长在屋时间
window.__yardTeleport = (x, z) => { cancelActivity(); girl.position.set(x, 0, z); walk.state = 'idle'; walk.idleUntil = 1e9; };   // 调试：原地站定
window.__yardStep = (n = 1) => { for (let i = 0; i < n; i++) animate(); };
window.__yardTarget = (x, y, z) => { controls.minDistance = 0.3; controls.target.set(x, y, z); controls.update(); };   // 调试：改环绕中心（允许贴近看）
window.__yardGirl = () => ({ girl, walk, iGirl, roomGroup, swingSeat, bench });
window.__yardVRM = () => !!girlVRM;
window.__yardGPU = () => GPU_INFO;               // 调试：直接摆弄女孩状态
window.__renderer = renderer;
window.__yardClickDoor = () => {
  camera.updateMatrixWorld(true);
  const w = new THREE.Vector3();
  if (doorExitHit) doorExitHit.getWorldPosition(w);
  else roomExitDoor.getWorldPosition(w);
  const p = w.clone().project(camera);
  const r = renderer.domElement.getBoundingClientRect();
  const x = (p.x * 0.5 + 0.5) * r.width + r.left;
  const y = (-p.y * 0.5 + 0.5) * r.height + r.top;
  const el = renderer.domElement;
  const base = { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse' };
  el.dispatchEvent(new PointerEvent('pointerdown', Object.assign({ buttons: 1 }, base)));
  el.dispatchEvent(new PointerEvent('pointerup', Object.assign({ buttons: 0 }, base)));
  return { x: Math.round(x), y: Math.round(y), imode: interiorMode, pick: window.__pick(x, y) };
};
{
  const q = new URLSearchParams(location.search);
  if (q.has('inside') || q.has('clickdoor')) {
    const cam = q.get('cam') || (q.has('clickdoor') ? '-2.3,2.1,3.1416' : '');
    if (cam) {
      const [x, z, yaw] = cam.split(',').map(Number);
      if (Number.isFinite(x)) camL.x = x;
      if (Number.isFinite(z)) camL.z = z;
      if (Number.isFinite(yaw)) interiorCam.yaw = yaw;
    }
    // 跳过过渡，调试直达室内
    controls.enabled = false;
    interiorCam.pos.copy(camera.position);
    interiorCam.target.copy(controls.target);
    if (!cam) { camL.x = -3.2; camL.z = 0.4; interiorCam.yaw = 0; }
    if (!Number.isFinite(interiorCam.pitch)) interiorCam.pitch = -0.16;
    else if (!cam) interiorCam.pitch = -0.16;
    setShellWallsVisible(false);
    btnExit.style.display = '';
    hint.style.display = 'none';
    camera.fov = 52; camera.near = 0.06; camera.updateProjectionMatrix();
    camera.rotation.order = 'YXZ';
    indoorEyePos(camera.position);
    camera.rotation.set(interiorCam.pitch, interiorCam.yaw, 0);
    interiorMode = true;
    syncTouchChrome(true);
    showIndoorSessionHint();
    if (q.has('clickdoor')) {
      setTimeout(() => { window.__doorClickResult = window.__yardClickDoor(); }, 600);
    }
  }
}
animate();
loadGirlVRM();   // 异步加载 VRM 人物，加载好之前先用手搓模型
if (GPU_INFO.software) {
  setTimeout(() => showToast('浏览器没用上显卡，画面会卡：请在浏览器设置里打开「硬件加速」后重启', 8000), 1500);
}
console.info('[小院] GPU:', GPU_INFO.name || '(unknown)', GPU_INFO.software ? '(软件渲染)' : '(硬件加速)');
</script>
